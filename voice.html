<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0">

<title>TNEX Voice Chat</title>

<script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>

<style>

/* =====================================================
   RESET
===================================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#02080f;
    color:#fff;
}


/* =====================================================
   COLORS
===================================================== */

:root{
    --bg:#02080f;
    --bg2:#041321;
    --panel:#061522;
    --panel2:#081b2b;

    --blue:#008cff;
    --blue2:#0067ad;
    --cyan:#16baff;

    --border:#07588c;

    --text:#f2f6fa;
    --muted:#7f9aae;

    --red:#ed1238;
}


/* =====================================================
   MAIN PAGE
===================================================== */

.page{
    position:relative;
    width:100vw;
    height:100vh;

    background:
        radial-gradient(
            circle at 50% 40%,
            rgba(0,113,190,.18),
            transparent 42%
        ),
        linear-gradient(
            145deg,
            #01060b 0%,
            #031522 55%,
            #062c47 100%
        );
}


/* subtle grid */

.page::before{
    content:"";
    position:absolute;
    inset:0;

    background-image:
        linear-gradient(
            rgba(0,145,220,.035) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(0,145,220,.035) 1px,
            transparent 1px
        );

    background-size:48px 48px;

    pointer-events:none;
}


/* =====================================================
   LOGIN PAGE
===================================================== */

#loginPage{
    display:flex;
    align-items:center;
    justify-content:center;
}

.login-box{
    width:min(420px,90%);
    text-align:center;

    position:relative;
    z-index:5;
}


/* logo */

.logo-big{

    height:105px;

    margin:0 auto 25px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:1px solid #dce7ee;
    border-radius:27px;

    background:
        linear-gradient(
            145deg,
            #09253a,

        );

    font-size:27px;
    font-weight:900;
    letter-spacing:2px;

    box-shadow:
        0 12px 40px rgba(0,0,0,.55);
}


/* avatar chooser */

.avatar-picker{
    position:relative;

    width:92px;
    height:92px;

    margin:0 auto 18px;

    cursor:pointer;
}

.avatar-preview{
    width:92px;
    height:92px;

    border-radius:50%;

    object-fit:cover;

    background:
        linear-gradient(
            145deg,
            #0b5b8d,
            #031a2c
        );

    border:2px solid #098dd0;

    display:flex;
    align-items:center;
    justify-content:center;

    box-shadow:
        0 0 25px rgba(0,140,255,.2);
}

.avatar-picker-button{
    position:absolute;

    right:-3px;
    bottom:-3px;

    width:31px;
    height:31px;

    border-radius:50%;

    border:2px solid #03111c;

    background:#078ee0;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:15px;
}

.avatar-hint{
    color:#7893a7;
    font-size:11px;
    margin-bottom:18px;
}


.login-box h1{
    font-size:36px;
    font-weight:900;
    letter-spacing:2px;
}

.login-box h1 span{
    color:#35aee9;
}

.subtitle{
    color:#809aac;
    margin:10px 0 25px;
    font-size:14px;
}


.name-input{
    width:100%;
    height:55px;

    padding:0 16px;

    border:1px solid #17435e;
    border-radius:10px;

    outline:none;

    background:#030c14;
    color:white;

    font-size:15px;
}

.name-input:focus{

}


.join-btn{
    width:100%;
    height:55px;

    margin-top:12px;

    border:1px solid #0788c9;
    border-radius:10px;

    background:
        linear-gradient(
            90deg,
            #064c7c,
            #087ebc
        );

    color:white;

    font-size:15px;
    font-weight:bold;

    cursor:pointer;
}

.join-btn:active{
    transform:scale(.98);
}


.login-status{
    min-height:18px;

    margin-top:12px;

    color:#7893a7;

    font-size:12px;
}


/* hidden file input */

#avatarInput{
    display:none;
}


/* =====================================================
   CALL PAGE
===================================================== */

#callPage{
    display:none;
    flex-direction:column;
}


/* =====================================================
   HEADER
===================================================== */

.call-header{
    height:67px;

    flex-shrink:0;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 20px;

    background:#020b13;

    border-bottom:1px solid #10334a;

    position:relative;
    z-index:20;
}


.brand{
    display:flex;
    align-items:center;
    gap:11px;
}


.logo-small{
    width:41px;
    height:41px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:1px solid #dce7ee;
    border-radius:10px;

    font-size:10px;
    font-weight:bold;
}


.brand-title{
    font-size:15px;
    font-weight:bold;
}


.status{
    margin-top:4px;

    font-size:11px;

    color:#51d995;
}


.settings-top{
    width:42px;
    height:42px;

    border:1px solid #16425c;
    border-radius:10px;

    background:#071722;

    color:#dce9f1;

}


/* =====================================================
   CONTENT
===================================================== */

.call-content{
    flex:1;

    min-height:0;

    padding:16px;

    overflow:auto;

    position:relative;
    z-index:2;
}


.video-grid{
    width:100%;
    min-height:100%;

    display:grid;

    grid-template-columns:
        repeat(auto-fit,minmax(245px,1fr));

    gap:13px;

    align-content:center;
}


/* =====================================================
   PARTICIPANT CARD
===================================================== */

.participant{
    position:relative;

    min-height:205px;

    overflow:hidden;

    border:1px solid #075f98;

    border-radius:13px;

    background:
        radial-gradient(
            circle at 50% 45%,
            #07385c,
            #03111d 72%
        );

    display:flex;

    align-items:center;
    justify-content:center;

    box-shadow:
        inset 0 0 30px rgba(0,110,190,.08);
}


.participant video{
    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    z-index:1;
}


/* avatar */

.participant-avatar{
    width:88px;
    height:88px;

    border-radius:50%;

    object-fit:cover;

    border:2px solid #078bd1;

    box-shadow:

}


.participant-name{
    position:absolute;

    left:10px;
    bottom:10px;

    padding:7px 10px;

    border-radius:8px;

    border:1px solid #17394e;

    font-size:12px;

    z-index:8;
}


.mic-icon{

}


.video-badge{
    position:absolute;

    top:10px;
    right:10px;

    border-radius:6px;

}


/* =====================================================
   INVITE CARD
===================================================== */

.invite-card{

    border:1px dashed #075f98;

    border-radius:13px;

    background:
        rgba(3,18,30,.6);

    align-items:center;
    justify-content:center;

    cursor:pointer;
}


.invite-plus{
    color:#079fe8;

    font-size:42px;

    line-height:1;
}


.invite-text{
    margin-top:12px;

    color:#7fa5bc;

    font-size:13px;
}


/* =====================================================
   BOTTOM CONTROLS
===================================================== */

.bottom-bar{
    height:92px;

    flex-shrink:0;

    display:flex;

    justify-content:center;
    align-items:center;

    background:#02090f;

}


.control-box{

    display:flex;

    align-items:center;
    justify-content:center;

    gap:23px;

    background:#11171c;

}


.control{
    width:52px;
    height:52px;

    border:0;

    border-radius:50%;

    background:#222b31;

    color:#edf3f7;

    font-size:21px;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;
}


.control:hover{
    background:#2d3942;
}


.control.off{
    background:#292d31;
    color:#aab4bb;
}


.hangup{
    width:58px;
    height:58px;

    border:0;

    border-radius:16px;

    background:#ed1238;

    color:white;

    font-size:25px;

    cursor:pointer;

    box-shadow:
        0 6px 18px rgba(237,18,56,.22);
}


.hangup:hover{
    background:#fa2549;
}


/* =====================================================
   SETTINGS PANEL
===================================================== */

.settings-panel{
    position:absolute;

    right:18px;
    top:78px;

    width:340px;

}

.settings-header{

    padding-bottom:14px;

}


.settings-header h3{

}


.close-settings{
    border:0;
    background:none;

    color:#91a9b9;

    font-size:24px;

    cursor:pointer;
}


/* tabs */

.tabs{
    display:flex;

    margin:12px 0;

    border-bottom:1px solid #12374e;
}


.tab{
    flex:1;

    text-align:center;

    padding:10px 5px;

    color:#7591a4;

    font-size:13px;

    cursor:pointer;
}


.tab.active{
    color:white;

    background:#075d95;

    border-radius:8px 8px 0 0;
}


/* settings */

.setting{
    margin-bottom:14px;
}


.setting label{
    display:block;

    margin-bottom:6px;

    color:#91aabd;

    font-size:11px;
}


.setting select{
    width:100%;
    height:41px;

    padding:0 9px;

    border:1px solid #17445e;
    border-radius:8px;

    background:#061521;

    color:white;

    outline:none;
}


.setting-row{
    display:flex;

    align-items:center;
    justify-content:space-between;

    padding:11px 0;

    border-top:1px solid #102d3f;

    color:#aec1ce;

    font-size:12px;
}


.switch{
    width:40px;
    height:21px;

    border-radius:20px;

    background:#29363f;

    position:relative;

    cursor:pointer;
}


.switch::after{
    content:"";

    position:absolute;

    width:15px;
    height:15px;

    top:3px;
    left:3px;

    border-radius:50%;

    background:#dbe4e9;

    transition:.2s;
}


.switch.on{
    background:#078bd0;
}


.switch.on::after{
    left:22px;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:650px){

    .login-box h1{
        font-size:29px;
    }

    .logo-big{
        width:88px;
        height:88px;
        font-size:23px;
    }

    .call-header{
        height:62px;
        padding:0 12px;
    }

    .brand-title{

    }

    .call-content{
        padding:9px;
    }

    .video-grid{
        grid-template-columns:1fr;
        gap:9px;
    }

    .participant{
        min-height:175px;
    }

    .bottom-bar{
        height:84px;
    }

    .control-box{
        min-width:0;
        width:calc(100% - 18px);
        height:67px;
        gap:10px;
        padding:6px 10px;
    }

    .control{
        width:46px;
        height:46px;
        font-size:19px;
    }

    .hangup{
        width:51px;
        height:51px;
    }

    .settings-panel{
        top:70px;
        right:9px;
        width:calc(100% - 18px);
    }
}

</style>
</head>


<body>


<!-- =====================================================
     LOGIN PAGE
===================================================== -->

<div id="loginPage" class="page">

    <div class="login-box">


        <!-- AVATAR -->

            class="avatar-picker"

        >

<!-- =====================================================

===================================================== -->

<div id="callPage" class="page">


    <!-- HEADER -->

    <header class="call-header">

        <div class="brand">

            <div class="logo-small">
                TNEX
            </div>

            <div>

                <div class="brand-title">
                    TNEX Voice Chat
                </div>

                <div class="status">

                    <span id="participantCount">

                </div>

                    class="switch on"

                ></div>

<script>

/* =====================================================
   LIVEKIT
===================================================== */

const TOKEN_SERVER_ID =
    "tnexvoicechat-1mbm19";


const tokenSource =
    LivekitClient.TokenSource
        .developmentTokenServer(
            TOKEN_SERVER_ID
        );


const {
    Room,
    RoomEvent,
    Track
} = LivekitClient;



/* =====================================================
   ROOM
===================================================== */

const ROOM_NAME =
    "tnex-main";


let room = null;

let myName = "";

let myAvatar = "";



/* =====================================================
   DEFAULT AVATAR
===================================================== */

function defaultAvatar(){

    return `
        <svg
            xmlns="http://www.w3.org/2000/svg"
            width="256"
            height="256"
            viewBox="0 0 256 256"
        >

            <rect
                width="256"
                height="256"
                rx="128"
                fill="#062b45"
            />

            <circle
                cx="128"
                cy="94"
                r="45"
                fill="#1499df"
            />

            <path
                d="
                M48 225
                C53 170
                91 145
                128 145
                C165 145
                203 170
                208 225
                Z"
                fill="#1499df"
            />

        </svg>
    `;

}


/* show default */

const defaultAvatarURL =
    "data:image/svg+xml;charset=UTF-8," +
    encodeURIComponent(
        defaultAvatar()
    );


document
    .getElementById("avatarPreview")
    .src =
    defaultAvatarURL;



/* =====================================================
   CHOOSE AVATAR
===================================================== */

function chooseAvatar(event){

    const file =
        event.target.files[0];

    if(!file) return;


    if(!file.type.startsWith("image/")){

        alert("Pilih file gambar.");

        return;

    }


    const reader =
        new FileReader();


    reader.onload =
        function(e){

            myAvatar =
                e.target.result;

            document
                .getElementById(
                    "avatarPreview"
                )
                .src =
                myAvatar;

        };


    reader.readAsDataURL(file);

}



/* =====================================================
   COMPRESS AVATAR
===================================================== */

function compressAvatar(
    dataURL
){

    return new Promise(
        resolve => {

            const img =
                new Image();


            img.onload =
                function(){

                    const canvas =
                        document.createElement(
                            "canvas"
                        );


                    const size =
                        256;


                    canvas.width =
                        size;

                    canvas.height =
                        size;


                    const ctx =
                        canvas.getContext(
                            "2d"
                        );


                    ctx.drawImage(
                        img,
                        0,
                        0,
                        size,
                        size
                    );


                    resolve(
                        canvas.toDataURL(
                            "image/jpeg",
                            .72
                        )
                    );

                };


            img.src =
                dataURL;

        }
    );

}



/* =====================================================
   JOIN ROOM
===================================================== */

async function joinRoom(){

    const input =
        document.getElementById(
            "nameInput"
        );


    myName =
        input.value.trim();


    if(!myName){

        document
            .getElementById(
                "loginStatus"
            )
            .innerText =
            "Masukkan nama kamu dulu.";

        return;

    }


    document
        .getElementById(
            "loginStatus"
        )
        .innerText =
        "Menghubungkan...";


    try{


        /* avatar */

        if(!myAvatar){

            myAvatar =
                defaultAvatarURL;

        }


        myAvatar =
            await compressAvatar(
                myAvatar
            );



        /* token */

        const credentials =
            await tokenSource.fetch({

                roomName:
                    ROOM_NAME,

                participantName:
                    myName

            });



        /* room */

        room =
            new Room({

                adaptiveStream:true,

                dynacast:true

            });



        setupEvents();



        await room.connect(

            credentials.serverUrl,

            credentials.participantToken

        );



        /* metadata avatar */

        try{

            await room
                .localParticipant
                .setMetadata(
                    JSON.stringify({
                        avatar:myAvatar
                    })
                );

        }
        catch(e){

            console.log(
                "Metadata avatar gagal:",
                e
            );

        }



        /* mic ON */

        await room
            .localParticipant
            .setMicrophoneEnabled(
                true
            );



        /* camera OFF */

        await room
            .localParticipant
            .setCameraEnabled(
                false
            );



        /* switch page */

        document
            .getElementById(
                "loginPage"
            )
            .style.display =
            "none";


        document
            .getElementById(
                "callPage"
            )
            .style.display =
            "flex";



        /* local participant */

        addParticipant(
            room.localParticipant
        );



        /* existing participants */

        room.remoteParticipants
            .forEach(
                participant => {

                    addParticipant(
                        participant
                    );

                }
            );



        updateCount();

        updateButtons();

        loadDevices();

    }
    catch(error){

        console.error(error);

        document
            .getElementById(
                "loginStatus"
            )
            .innerText =
            "Gagal terhubung: " +
            error.message;

    }

}



/* =====================================================
   EVENTS
===================================================== */

function setupEvents(){


    room.on(

        RoomEvent.TrackSubscribed,

        (
            track,
            publication,
            participant
        ) => {

            addTrack(
                track,
                participant
            );

        }

    );



    room.on(

        RoomEvent.TrackUnsubscribed,

        track => {

            track
                .detach()
                .forEach(
                    element =>
                        element.remove()
                );

        }

    );



    room.on(

        RoomEvent.ParticipantConnected,

        participant => {

            addParticipant(
                participant
            );

            updateCount();

        }

    );



    room.on(

        RoomEvent.ParticipantDisconnected,

        participant => {

            removeParticipant(
                participant.identity
            );

            updateCount();

        }

    );



    room.on(

        RoomEvent.LocalTrackPublished,

        publication => {

            if(publication.track){

                addTrack(

                    publication.track,

                    room.localParticipant

                );

            }

        }

    );



    room.on(

        RoomEvent.LocalTrackUnpublished,

        publication => {

            if(publication.track){

                publication.track
                    .detach()
                    .forEach(
                        element =>
                            element.remove()
                    );

            }

        }

    );



    /* avatar update */

    room.on(

        RoomEvent.ParticipantMetadataChanged,

        (
            metadata,
            participant
        ) => {

            updateParticipantAvatar(
                participant
            );

        }

    );

}



/* =====================================================
   ADD PARTICIPANT
===================================================== */

function addParticipant(
    participant
){

    let existing =
        document.getElementById(
            "user-" +
            participant.identity
        );


    if(existing){

        updateParticipantAvatar(
            participant
        );

        return;

    }



    const tile =
        document.createElement(
            "div"
        );


    tile.className =
        "participant";


    tile.id =
        "user-" +
        participant.identity;



    /* avatar */

    const avatar =
        document.createElement(
            "img"
        );


    avatar.className =
        "participant-avatar";


    avatar.src =
        getParticipantAvatar(
            participant
        );



    /* name */

    const name =
        document.createElement(
            "div"
        );


    name.className =
        "participant-name";


    name.innerHTML =
        `<span class="mic-icon">🎙️</span>` +
        escapeHTML(
            participant.name ||
            participant.identity
        );



    /* video badge */

    const badge =
        document.createElement(
            "div"
        );


    badge.className =
        "video-badge";


    badge.innerText =
        "VOICE";



    tile.appendChild(
        avatar
    );


    tile.appendChild(
        name
    );


    tile.appendChild(
        badge
    );


    document
        .getElementById(
            "videoGrid"
        )
        .appendChild(
            tile
        );



    /* existing tracks */

    participant.trackPublications
        .forEach(
            publication => {

                if(publication.track){

                    addTrack(

                        publication.track,

                        participant

                    );

                }

            }
        );

}



/* =====================================================
   GET AVATAR
===================================================== */

function getParticipantAvatar(
    participant
){

    try{

        if(participant.metadata){

            const data =
                JSON.parse(
                    participant.metadata
                );


            if(data.avatar){

                return data.avatar;

            }

        }

    }
    catch(e){

        console.log(e);

    }


    return defaultAvatarURL;

}



/* =====================================================
   UPDATE AVATAR
===================================================== */

function updateParticipantAvatar(
    participant
){

    const tile =
        document.getElementById(
            "user-" +
            participant.identity
        );


    if(!tile) return;


    const avatar =
        tile.querySelector(
            ".participant-avatar"
        );


    if(avatar){

        avatar.src =
            getParticipantAvatar(
                participant
            );

    }

}



/* =====================================================
   TRACK
===================================================== */

function addTrack(
    track,
    participant
){

    const tile =
        document.getElementById(
            "user-" +
            participant.identity
        );


    if(!tile) return;



    /* VIDEO */

    if(
        track.kind ===
        Track.Kind.Video
    ){

        const old =
            tile.querySelector(
                "video"
            );


        if(old){

            old.remove();

        }


        const video =
            track.attach();


        video.autoplay =
            true;


        video.playsInline =
            true;


        tile.insertBefore(
            video,
            tile.firstChild
        );


        const avatar =
            tile.querySelector(
                ".participant-avatar"
            );


        if(avatar){

            avatar.style.display =
                "none";

        }


        const badge =
            tile.querySelector(
                ".video-badge"
            );


        if(badge){

            badge.innerText =
                "VIDEO";

        }

    }



    /* AUDIO */

    if(
        track.kind ===
        Track.Kind.Audio
    ){

        const audio =
            track.attach();


        audio.autoplay =
            true;


        tile.appendChild(
            audio
        );

    }

}

/* =====================================================
   SETTINGS TABS
===================================================== */

function openTab(
    element,
    id
){

    document
        .querySelectorAll(
            ".tab"
        )
        .forEach(
            tab =>
                tab.classList.remove(
                    "active"
                )
        );


    element.classList.add(
        "active"
    );


    document
        .getElementById(
            "audioTab"
        ).style.display =
        "none";


    document
        .getElementById(
            "videoTab"
        ).style.display =
        "none";


    document
        .getElementById(
            "generalTab"
        ).style.display =
        "none";


    document
        .getElementById(
            id
        ).style.display =
        "block";

}



/* =====================================================
   LOAD DEVICES
===================================================== */

async function loadDevices(){

    try{

        const devices =
            await navigator
                .mediaDevices
                .enumerateDevices();


        const mic =
            document.getElementById(
                "micSelect"
            );


        const camera =
            document.getElementById(
                "cameraSelect"
            );


        const micDevices =
            devices.filter(
                d =>
                    d.kind ===
                    "audioinput"
            );


        const cameraDevices =
            devices.filter(
                d =>
                    d.kind ===
                    "videoinput"
            );


        mic.innerHTML = "";


        camera.innerHTML = "";


        micDevices.forEach(
            device => {

                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    device.deviceId;


                option.textContent =
                    device.label ||
                    "Microphone";


                mic.appendChild(
                    option
                );

            }
        );


        cameraDevices.forEach(
            device => {

                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    device.deviceId;


                option.textContent =
                    device.label ||
                    "Camera";


                camera.appendChild(
                    option
                );

            }
        );

    }
    catch(error){

        console.log(
            "Device list:",
            error
        );

    }

}



/* =====================================================
   LEAVE
===================================================== */

function leaveRoom(){

    if(room){

        room.disconnect();

        room = null;

    }


    document
        .getElementById(
            "videoGrid"
        )
        .innerHTML =
        "";


    document
        .getElementById(
            "callPage"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "loginPage"
        )
        .style.display =
        "flex";


    document
        .getElementById(
            "loginStatus"
        )
        .innerText =
        "Kamu sudah keluar dari TNEX Voice Chat.";

}



/* =====================================================
   REMOVE PARTICIPANT
===================================================== */

function removeParticipant(
    identity
){

    const tile =
        document.getElementById(
            "user-" +
            identity
        );


    if(tile){

        tile.remove();

    }

}



/* =====================================================
   PARTICIPANT COUNT
===================================================== */

function updateCount(){

    if(!room) return;


    const count =
        1 +
        room.remoteParticipants.size;


    document
        .getElementById(
            "participantCount"
        )
        .innerText =
        "• " +
        count +
        " peserta";

}



/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(
    text
){

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
