<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TNEX Voice Chat</title>

<script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #0b1020;
    color: white;
    height: 100vh;
    overflow: hidden;
}

/* LAYOUT */
.app {
    display: flex;
    height: 100vh;
}

/* SIDEBAR */
.sidebar {
    width: 240px;
    background: #080d18;
    border-right: 1px solid #20283b;
    padding: 15px;
}

.server-title {
    font-size: 21px;
    font-weight: bold;
    padding: 10px;
    margin-bottom: 25px;
}

.category {
    color: #737d94;
    font-size: 12px;
    font-weight: bold;
    margin: 15px 10px 8px;
}

.channel {
    padding: 12px;
    border-radius: 8px;
    color: #aeb7c9;
    cursor: pointer;
    margin-bottom: 4px;
}

.channel:hover,
.channel.active {
    background: #182238;
    color: white;
}

/* MAIN */
.main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.header {
    height: 60px;
    border-bottom: 1px solid #20283b;
    display: flex;
    align-items: center;
    padding: 0 20px;
    font-size: 18px;
    font-weight: bold;
}

.header span {
    color: #6f7b95;
    margin-right: 10px;
}

/* VIDEO AREA */
.video-area {
    flex: 1;
    padding: 18px;
    overflow-y: auto;
    display: flex;
    align-items: center;
    justify-content: center;
}

.video-grid {
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 15px;
    align-content: center;
}

/* VIDEO TILE */
.tile {
    position: relative;
    background: #111827;
    border: 1px solid #263149;
    border-radius: 12px;
    min-height: 200px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
}

.tile video {
    width: 100%;
    height: 100%;
    min-height: 200px;
    object-fit: cover;
}

.tile-name {
    position: absolute;
    left: 12px;
    bottom: 10px;
    background: rgba(0,0,0,.65);
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 13px;
    z-index: 2;
}

.avatar {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: linear-gradient(135deg,#182c55,#304d85);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 25px;
    font-weight: bold;
}

/* CONTROLS */
.controls {
    height: 80px;
    border-top: 1px solid #20283b;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    background: #090e1a;
}

.control {
    width: 48px;
    height: 48px;
    border: none;
    border-radius: 50%;
    background: #202a3e;
    color: white;
    font-size: 20px;
    cursor: pointer;
}

.control:hover {
    background: #30405d;
}

.control.off {
    background: #8d2935;
}

.leave {
    background: #d93649;
}

.leave:hover {
    background: #f04758;
}

/* JOIN */
.join-screen {
    position: fixed;
    inset: 0;
    background: #080d18;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 20;
}

.join-box {
    width: 90%;
    max-width: 400px;
    background: #111827;
    padding: 30px;
    border-radius: 15px;
    border: 1px solid #263149;
}

.join-box h1 {
    margin-bottom: 10px;
}

.join-box p {
    color: #8e99ae;
    margin-bottom: 20px;
}

input {
    width: 100%;
    padding: 13px;
    border-radius: 8px;
    border: 1px solid #303b55;
    background: #080d18;
    color: white;
    outline: none;
    margin-bottom: 12px;
}

.join-button {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 8px;
    background: #315b9e;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.join-button:hover {
    background: #3d70c0;
}

.status {
    margin-top: 12px;
    color: #8490a7;
    font-size: 13px;
}

/* MOBILE */
@media(max-width:700px) {
    .sidebar {
        width: 170px;
        padding: 10px;
    }

    .server-title {
        font-size: 17px;
    }

    .header {
        padding: 0 12px;
    }

    .video-area {
        padding: 10px;
    }

    .video-grid {
        grid-template-columns: 1fr;
    }

    .tile {
        min-height: 180px;
    }

    .controls {
        height: 70px;
    }

    .control {
        width: 44px;
        height: 44px;
    }
}
</style>
</head>

<body>

<!-- JOIN SCREEN -->
<div class="join-screen" id="joinScreen">
    <div class="join-box">
        <h1>TNEX Voice Chat</h1>
        <p>Masuk ke voice & video channel</p>

        <input id="nameInput" placeholder="Nama kamu">

        <button class="join-button" onclick="joinChannel('gaming')">
            🎮 Masuk Gaming
        </button>

        <div class="status" id="status">
            Pilih channel untuk masuk.
        </div>
    </div>
</div>

<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="server-title">
            ⚡ TNEX
        </div>

        <div class="category">
            VOICE CHANNELS
        </div>

        <div class="channel active" id="gamingChannel"
             onclick="joinChannel('gaming')">
            🎮 Gaming
        </div>

        <div class="channel" id="squadChannel"
             onclick="joinChannel('squad')">
            👥 Squad
        </div>

        <div class="channel" id="rankedChannel"
             onclick="joinChannel('ranked')">
            🏆 Ranked
        </div>

    </aside>

    <!-- MAIN -->
    <main class="main">

        <div class="header">
            <span>🔊</span>
            <div id="channelTitle">Gaming</div>
        </div>

        <div class="video-area">
            <div class="video-grid" id="videoGrid"></div>
        </div>

        <!-- CONTROLS -->
        <div class="controls">

            <button class="control" id="micBtn"
                    onclick="toggleMic()">
                🎤
            </button>

            <button class="control" id="cameraBtn"
                    onclick="toggleCamera()">
                📹
            </button>

            <button class="control"
                    onclick="toggleScreen()">
                🖥️
            </button>

            <button class="control leave"
                    onclick="leaveRoom()">
                📞
            </button>

        </div>

    </main>

</div>

<script>

const TOKEN_SERVER_ID = "tnexvoicechat-1mbm19";

const tokenSource =
    LivekitClient.TokenSource.developmentTokenServer(
        TOKEN_SERVER_ID
    );

const {
    Room,
    RoomEvent,
    Track
} = LivekitClient;

let room = null;
let currentChannel = "gaming";

/* =========================
   JOIN CHANNEL
========================= */

async function joinChannel(channel) {

    const name =
        document.getElementById("nameInput").value.trim();

    if (!name) {
        document.getElementById("status").innerText =
            "Masukkan nama kamu dulu.";
        return;
    }

    currentChannel = channel;

    const roomName = "tnex-" + channel;

    document.getElementById("status").innerText =
        "Menghubungkan...";

    try {

        const credentials = await tokenSource.fetch({
            roomName: roomName,
            participantName: name
        });

        room = new Room({
            adaptiveStream: true,
            dynacast: true
        });

        setupRoomEvents();

        await room.connect(
            credentials.serverUrl,
            credentials.participantToken
        );

        /* MIC + CAMERA */
        await room.localParticipant
            .enableCameraAndMicrophone();

        document.getElementById("joinScreen")
            .style.display = "none";

        document.getElementById("channelTitle")
            .innerText =
            capitalize(channel);

        updateChannelButtons();

        addLocalParticipant();

        /* ADD PARTICIPANTS YANG SUDAH ADA */
        room.remoteParticipants.forEach(
            participant => {
                addParticipant(participant);
            }
        );

        updateButtons();

    } catch (error) {

        console.error(error);

        document.getElementById("status").innerText =
            "Gagal masuk: " + error.message;
    }
}

/* =========================
   ROOM EVENTS
========================= */

function setupRoomEvents() {

    room.on(
        RoomEvent.TrackSubscribed,
        (track, publication, participant) => {

            addTrack(
                track,
                participant
            );
        }
    );

    room.on(
        RoomEvent.TrackUnsubscribed,
        (track, publication, participant) => {

            track.detach().forEach(
                element => element.remove()
            );
        }
    );

    room.on(
        RoomEvent.ParticipantConnected,
        participant => {

            addParticipant(participant);
        }
    );

    room.on(
        RoomEvent.ParticipantDisconnected,
        participant => {

            removeParticipant(
                participant.identity
            );
        }
    );

    room.on(
        RoomEvent.LocalTrackPublished,
        publication => {

            if (publication.track) {
                addTrack(
                    publication.track,
                    room.localParticipant
                );
            }
        }
    );

    room.on(
        RoomEvent.LocalTrackUnpublished,
        publication => {

            if (publication.track) {

                publication.track
                    .detach()
                    .forEach(
                        element => element.remove()
                    );
            }
        }
    );

    room.on(
        RoomEvent.Disconnected,
        () => {

            clearVideoGrid();
        }
    );
}

/* =========================
   LOCAL PARTICIPANT
========================= */

function addLocalParticipant() {

    const participant =
        room.localParticipant;

    const tile =
        createTile(
            participant.identity,
            participant.name || participant.identity
        );

    document
        .getElementById("videoGrid")
        .appendChild(tile);

    participant.trackPublications
        .forEach(publication => {

            if (publication.track) {

                addTrack(
                    publication.track,
                    participant
                );
            }
        });
}

/* =========================
   REMOTE PARTICIPANT
========================= */

function addParticipant(participant) {

    const existing =
        document.getElementById(
            "participant-" +
            participant.identity
        );

    if (!existing) {

        const tile =
            createTile(
                participant.identity,
                participant.name ||
                participant.identity
            );

        document
            .getElementById("videoGrid")
            .appendChild(tile);
    }

    participant.trackPublications
        .forEach(publication => {

            if (
                publication.isSubscribed &&
                publication.track
            ) {

                addTrack(
                    publication.track,
                    participant
                );
            }
        });
}

/* =========================
   ADD TRACK
========================= */

function addTrack(track, participant) {

    const tile =
        document.getElementById(
            "participant-" +
            participant.identity
        );

    if (!tile) return;

    /* VIDEO */
    if (
        track.kind === Track.Kind.Video
    ) {

        const video =
            track.attach();

        video.autoplay = true;
        video.playsInline = true;

        video.style.width = "100%";
        video.style.height = "100%";
        video.style.objectFit = "cover";

        tile.insertBefore(
            video,
            tile.firstChild
        );
    }

    /* AUDIO */
    if (
        track.kind === Track.Kind.Audio
    ) {

        const audio =
            track.attach();

        audio.autoplay = true;

        tile.appendChild(audio);
    }
}

/* =========================
   CREATE TILE
========================= */

function createTile(identity, name) {

    const tile =
        document.createElement("div");

    tile.className = "tile";

    tile.id =
        "participant-" + identity;

    const avatar =
        document.createElement("div");

    avatar.className = "avatar";

    avatar.innerText =
        (name || "?")
        .charAt(0)
        .toUpperCase();

    const label =
        document.createElement("div");

    label.className = "tile-name";

    label.innerText =
        name || identity;

    tile.appendChild(avatar);
    tile.appendChild(label);

    return tile;
}

/* =========================
   REMOVE PARTICIPANT
========================= */

function removeParticipant(identity) {

    const tile =
        document.getElementById(
            "participant-" + identity
        );

    if (tile) {
        tile.remove();
    }
}

/* =========================
   MICROPHONE
========================= */

async function toggleMic() {

    if (!room) return;

    const enabled =
        room.localParticipant
            .isMicrophoneEnabled;

    await room.localParticipant
        .setMicrophoneEnabled(!enabled);

    updateButtons();
}

/* =========================
   CAMERA
========================= */

async function toggleCamera() {

    if (!room) return;

    const enabled =
        room.localParticipant
            .isCameraEnabled;

    await room.localParticipant
        .setCameraEnabled(!enabled);

    updateButtons();
}

/* =========================
   SCREEN SHARE
========================= */

async function toggleScreen() {

    if (!room) return;

    const enabled =
        room.localParticipant
            .isScreenShareEnabled;

    await room.localParticipant
        .setScreenShareEnabled(!enabled);

    updateButtons();
}

/* =========================
   UPDATE BUTTON
========================= */

function updateButtons() {

    if (!room) return;

    const mic =
        document.getElementById("micBtn");

    const camera =
        document.getElementById("cameraBtn");

    mic.classList.toggle(
        "off",
        !room.localParticipant
            .isMicrophoneEnabled
    );

    camera.classList.toggle(
        "off",
        !room.localParticipant
            .isCameraEnabled
    );
}

/* =========================
   LEAVE
========================= */

function leaveRoom() {

    if (room) {

        room.disconnect();

        room = null;
    }

    clearVideoGrid();

    document.getElementById("joinScreen")
        .style.display = "flex";

    document.getElementById("status")
        .innerText =
        "Kamu sudah keluar dari room.";
}

/* =========================
   CLEAR
========================= */

function clearVideoGrid() {

    document.getElementById("videoGrid")
        .innerHTML = "";
}

/* =========================
   CHANNEL BUTTON
========================= */

function updateChannelButtons() {

    document
        .querySelectorAll(".channel")
        .forEach(el =>
            el.classList.remove("active")
        );

    const active =
        document.getElementById(
            currentChannel + "Channel"
        );

    if (active) {
        active.classList.add("active");
    }
}

/* =========================
   CAPITALIZE
========================= */

function capitalize(text) {

    return text.charAt(0).toUpperCase()
        + text.slice(1);
}

</script>

</body>
</html>
