<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>member.html - Custom Avatar & Card Border Generator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #030712;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: rgba(3, 7, 18, 0.95);
            border-bottom: 1px solid #1e293b;
        }

        .header-title {
            font-size: 15px;
            font-weight: bold;
            color: #38bdf8;
            letter-spacing: 0.5px;
        }

        .main-layout {
            display: flex;
            flex-direction: column;
            flex: 1;
            padding: 15px;
            gap: 15px;
            max-width: 1000px;
            margin: 0 auto;
            width: 100%;
        }

        @media (min-width: 768px) {
            .main-layout {
                flex-direction: row;
                padding: 20px;
                gap: 20px;
            }
        }

        /* Area Preview Card Besar */
        .preview-section {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b1329;
            border: 2px solid #0284c7;
            border-radius: 20px;
            padding: 30px;
            position: relative;
            min-height: 380px;
            box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.8);
        }

        /* Kotak Besar Card Utama */
        .large-card-box {
            width: 260px;
            height: 320px;
            background: linear-gradient(135deg, rgba(11, 25, 44, 0.95), rgba(3, 7, 18, 0.98));
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            gap: 15px;
            position: relative;
            transition: all 0.3s ease;
        }

        /* Container Avatar & Border Avatar */
        .avatar-container {
            position: relative;
            width: 110px;
            height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Foto Avatar di dalam */
        .avatar-img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            position: absolute;
            z-index: 1;
            background: #1e293b;
        }

        /* Border Avatar di Luar Foto */
        .avatar-border-overlay {
            position: absolute;
            width: 110px;
            height: 110px;
            z-index: 2;
            pointer-events: none;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }

        .card-nickname {
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            letter-spacing: 0.5px;
            text-align: center;
        }

        .card-role {
            font-size: 11px;
            color: #38bdf8;
            background: rgba(2, 132, 199, 0.15);
            border: 1px solid rgba(2, 132, 199, 0.4);
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 600;
        }

        /* Panel Kontrol Pengaturan (Kanan) */
        .control-sidebar {
            width: 100%;
            background: rgba(11, 25, 44, 0.95);
            border: 1px solid #0284c7;
            border-radius: 16px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 520px;
            overflow-y: auto;
        }

        @media (min-width: 768px) {
            .control-sidebar {
                width: 380px;
            }
        }

        .section-title {
            font-size: 11px;
            color: #38bdf8;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 2px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .input-group label {
            font-size: 11px;
            color: #94a3b8;
        }

        .input-group input, .input-group select {
            background: #030712;
            border: 1px solid #1e293b;
            color: white;
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 12px;
            outline: none;
        }

        .input-group input[type="color"] {
            width: 100%;
            height: 35px;
            cursor: pointer;
            padding: 2px;
        }

        /* Pilihan 10 Desain Border Avatar */
        .border-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
        }

        .border-option {
            background: #030712;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 6px;
            text-align: center;
            font-size: 10px;
            cursor: pointer;
            color: #94a3b8;
            transition: all 0.2s;
        }

        .border-option:hover, .border-option.active {
            border-color: #38bdf8;
            color: #ffffff;
            background: rgba(2, 132, 199, 0.2);
        }

        .action-btn {
            background: #0284c7;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            width: 100%;
            text-align: center;
            margin-top: 5px;
            transition: background 0.2s;
        }

        .action-btn:hover {
            background: #0369a1;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-title">TNEX - member.html</div>
        <div style="font-size: 11px; color: #94a3b8;">Custom Border Generator</div>
    </div>

    <div class="main-layout">
        <!-- Preview Hasil -->
        <div class="preview-section">
            <div class="large-card-box" id="largeCardBox">
                <!-- Avatar & Border Avatar -->
                <div class="avatar-container">
                    <img id="previewAvatarImg" class="avatar-img" src="https://images.unsplash.com/photo-1566492031773-4f4e44671857?w=150" alt="Avatar">
                    <div id="previewAvatarBorder" class="avatar-border-overlay"></div>
                </div>
                <div class="card-nickname" id="previewNickname">TNEX • Zaxer</div>
                <div class="card-role" id="previewRole">Jungler Pro</div>
            </div>
        </div>

        <!-- Panel Kontrol Pengaturan -->
        <div class="control-sidebar">
            <div class="section-title">1. Impor Foto Avatar</div>
            <div class="input-group">
                <label>Pilih Gambar dari Album/Perangkat:</label>
                <input type="file" id="uploadAvatarInput" accept="image/*" onchange="loadCustomAvatar(event)">
            </div>

            <div class="input-group">
                <label>Nama / Nickname:</label>
                <input type="text" id="inputNickname" value="TNEX • Zaxer" oninput="updateText()">
            </div>

            <div class="input-group">
                <label>Role / Keterangan:</label>
                <input type="text" id="inputRole" value="Jungler Pro" oninput="updateText()">
            </div>

            <hr style="border-color: #1e293b; margin: 4px 0;">

            <div class="section-title">2. Pilih Desain Border Avatar (10 Pilihan)</div>
            <div class="border-grid" id="borderGridContainer">
                <!-- 10 Tombol Pilihan Border -->
            </div>

            <hr style="border-color: #1e293b; margin: 4px 0;">

            <div class="section-title">3. Kustomisasi Border & Aura Kotak Besar</div>
            <div class="input-group">
                <label>Gaya Border Kotak Besar:</label>
                <select id="selectCardBorder" onchange="updateCardBorderStyling()">
                    <option value="solid">Solid Modern (Clean)</option>
                    <option value="neon">Neon Glowing Aura</option>
                    <option value="gold">Gold Luxury (Emas)</option>
                    <option value="dashed">Dashed Tactical</option>
                </select>
            </div>

            <div class="input-group">
                <label>Warna Aura / Glow Kotak Besar:</label>
                <input type="color" id="inputAuraColor" value="#0284c7" oninput="updateCardBorderStyling()">
            </div>

            <button class="action-btn" onclick="alert('Desain berhasil disesuaikan! Silakan screenshot atau simpan tampilan card.')">Simpan / Selesai</button>
        </div>
    </div>

    <script>
        const borderDesigns = [
            { id: 0, name: "Tanpa Border", css: "none" },
            { id: 1, name: "Epic Blue", css: "radial-gradient(circle, transparent 60%, #38bdf8 65%, #0284c7 100%)" },
            { id: 2, name: "Mythic Gold", css: "radial-gradient(circle, transparent 60%, #f59e0b 65%, #b45309 100%)" },
            { id: 3, name: "Collector Purple", css: "radial-gradient(circle, transparent 60%, #c084fc 65%, #7e22ce 100%)" },
            { id: 4, name: "Starlight Green", css: "radial-gradient(circle, transparent 60%, #4ade80 65%, #15803d 100%)" },
            { id: 5, name: "Legend Red", css: "radial-gradient(circle, transparent 60%, #f87171 65%, #b91c1c 100%)" },
            { id: 6, name: "Crystal Cyan", css: "radial-gradient(circle, transparent 58%, #22d3ee 62%, #0891b2 70%, transparent 72%)" },
            { id: 7, name: "Royal Orange", css: "radial-gradient(circle, transparent 60%, #fb923c 65%, #c2410c 100%)" },
            { id: 8, name: "Silver Rank", css: "radial-gradient(circle, transparent 60%, #cbd5e1 65%, #475569 100%)" },
            { id: 9, name: "Dark Abyss", css: "radial-gradient(circle, transparent 55%, #1e293b 62%, #0f172a 75%, #38bdf8 80%)" }
        ];

        let currentBorderIndex = 1;

        function initBorderGrid() {
            const container = document.getElementById('borderGridContainer');
            container.innerHTML = '';
            borderDesigns.forEach((item, idx) => {
                const btn = document.createElement('div');
                btn.className = `border-option ${idx === currentBorderIndex ? 'active' : ''}`;
                btn.innerText = `Bdr ${idx}`;
                btn.title = item.name;
                btn.onclick = () => selectBorderAvatar(idx);
                container.appendChild(btn);
            });
            applyBorderToPreview();
        }

        function selectBorderAvatar(idx) {
            currentBorderIndex = idx;
            document.querySelectorAll('.border-option').forEach((el, i) => {
                if(i === idx) el.classList.add('active');
                else el.classList.remove('active');
            });
            applyBorderToPreview();
        }

        function applyBorderToPreview() {
            const borderEl = document.getElementById('previewAvatarBorder');
            const selected = borderDesigns[currentBorderIndex];
            if(selected.id === 0) {
                borderEl.style.background = 'none';
                borderEl.style.border = 'none';
            } else {
                borderEl.style.background = selected.css;
                borderEl.style.border = 'none';
            }
        }

        function loadCustomAvatar(event) {
            const file = event.target.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('previewAvatarImg').src = e.target.result;
                }
                reader.readAsDataURL(file);
            }
        }

        function updateText() {
            document.getElementById('previewNickname').innerText = document.getElementById('inputNickname').value;
            document.getElementById('previewRole').innerText = document.getElementById('inputRole').value;
        }

        function updateCardBorderStyling() {
            const cardBox = document.getElementById('largeCardBox');
            const styleType = document.getElementById('selectCardBorder').value;
            const auraColor = document.getElementById('inputAuraColor').value;

            cardBox.style.borderColor = auraColor;

            if(styleType === 'solid') {
                cardBox.style.border = `2px solid ${auraColor}`;
                cardBox.style.boxShadow = `none`;
            } else if(styleType === 'neon') {
                cardBox.style.border = `2px solid ${auraColor}`;
                cardBox.style.boxShadow = `0 0 20px ${auraColor}, inset 0 0 15px ${auraColor}40`;
            } else if(styleType === 'gold') {
                cardBox.style.border = `2px solid #f59e0b`;
                cardBox.style.boxShadow = `0 0 20px rgba(245, 158, 11, 0.6)`;
            } else if(styleType === 'dashed') {
                cardBox.style.border = `2px dashed ${auraColor}`;
                cardBox.style.boxShadow = `0 0 10px ${auraColor}`;
            }
        }

        window.onload = function() {
            initBorderGrid();
            updateCardBorderStyling();
        };
    </script>
</body>
</html>
