<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEAM SNEXTY — Epic Mythic Roster</title>
<style>
:root {
    --bg-base: #030508;
    --bg-surface: #070d14;
    --text-main: #f0f6fc;
    --text-muted: #8397ad;
    --green: #2ecc71;
    --offline-gray: #4a596a;
}

/* WARNA AURA & ORNAMEN MEWAH BERDASARKAN ROLE */
.role-goldlaner { 
    --p-color: #ffd700; 
    --s-color: #ffaa00;
    --aura-glow: rgba(255, 215, 0, 0.4); 
    --card-bg: linear-gradient(145deg, #09121c, #161809);
}
.role-midlaner { 
    --p-color: #b026ff; 
    --s-color: #7928ca;
    --aura-glow: rgba(176, 38, 255, 0.4); 
    --card-bg: linear-gradient(145deg, #09121c, #15091c);
}
.role-jungler { 
    --p-color: #ff3333; 
    --s-color: #ff6b6b;
    --aura-glow: rgba(255, 51, 51, 0.4); 
    --card-bg: linear-gradient(145deg, #09121c, #1c0909);
}
.role-roamer { 
    --p-color: #00ff66; 
    --s-color: #00b347;
    --aura-glow: rgba(0, 255, 102, 0.4); 
    --card-bg: linear-gradient(145deg, #09121c, #091c10);
}
.role-subroam { 
    --p-color: #00ffff; 
    --s-color: #0088ff;
    --aura-glow: rgba(0, 255, 255, 0.4); 
    --card-bg: linear-gradient(145deg, #09121c, #09191c);
}
.role-explaner { 
    --p-color: #ff8800; 
    --s-color: #ff3300;
    --aura-glow: rgba(255, 136, 0, 0.4); 
    --card-bg: linear-gradient(145deg, #09121c, #1c1309);
}
.role-coach { 
    --p-color: #ff007f; 
    --s-color: #9900ff;
    --aura-glow: rgba(255, 0, 127, 0.4); 
    --card-bg: linear-gradient(145deg, #09121c, #1c0915);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background-color: var(--bg-base);
    color: var(--text-main);
    background-image: 
        radial-gradient(circle at 15% 10%, rgba(22, 140, 255, 0.08), transparent 35%),
        radial-gradient(circle at 85% 90%, rgba(255, 215, 0, 0.05), transparent 40%);
    background-attachment: fixed;
    overflow-x: hidden;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image: 
        linear-gradient(to right, rgba(21, 41, 61, 0.12) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(21, 41, 61, 0.12) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: -1;
}

.wrapper {
    max-width: 1280px;
    margin: 0 auto;
    padding: 40px 20px 60px;
}

.roster-header {
    text-align: center;
    margin-bottom: 45px;
}

.roster-header span {
    color: #ffd700;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 4px;
    text-transform: uppercase;
    background: rgba(255, 215, 0, 0.08);
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid rgba(255, 215, 0, 0.3);
}

.roster-header h1 {
    font-size: clamp(28px, 5vw, 42px);
    font-weight: 900;
    margin-top: 15px;
    letter-spacing: -0.5px;
    background: linear-gradient(180deg, #fff, #91b5d6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.roster-header p {
    color: var(--text-muted);
    font-size: 14px;
    max-width: 550px;
    margin: 10px auto 0;
    line-height: 1.6;
}

.roster-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
    gap: 30px;
}

/* KOTAK KARTU BESAR DENGAN BORDER ALA BORDER GAME SULTAN */
.agent-card {
    background: var(--card-bg);
    border-radius: 24px;
    overflow: hidden;
    position: relative;
    cursor: pointer;
    transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    /* BORDER LAPIS MEWAH: Inner border + Outer glowing border */
    border: 3px solid var(--p-color);
    box-shadow: 
        0 12px 35px rgba(0, 0, 0, 0.8), 
        inset 0 0 15px var(--aura-glow),
        0 0 25px var(--aura-glow);
}

/* ORNAMEN TAMBAHAN SUDUT KARTU BESAR (SAYAP / WAH EFFECT) */
.agent-card::before {
    content: "";
    position: absolute;
    top: -3px;
    left: -3px;
    right: -3px;
    bottom: -3px;
    border-radius: 24px;
    border: 1px dashed var(--s-color);
    pointer-events: none;
    opacity: 0.6;
}

.agent-card:hover {
    transform: translateY(-8px) scale(1.01);
    box-shadow: 
        0 20px 50px rgba(0, 0, 0, 0.9), 
        inset 0 0 25px var(--p-color),
        0 0 40px var(--p-color);
}

.card-banner {
    height: 125px;
    background: rgba(3, 7, 12, 0.85);
    position: relative;
    display: flex;
    justify-content: flex-end;
    padding: 14px;
    border-bottom: 2px solid var(--p-color);
}

.agent-role {
    background: rgba(3, 5, 7, 0.95);
    border: 1px solid var(--p-color);
    color: var(--p-color);
    font-size: 10px;
    font-weight: 900;
    padding: 5px 12px;
    border-radius: 8px;
    letter-spacing: 1.2px;
    height: fit-content;
    box-shadow: 0 0 12px var(--aura-glow);
}

/* BORDER AVATAR MEWAH MENYALA */
.agent-avatar-wrap {
    position: absolute;
    left: 20px;
    bottom: -36px;
    width: 90px;
    height: 90px;
    border-radius: 20px;
    border: 4px solid var(--p-color);
    background: var(--bg-surface);
    overflow: hidden;
    box-shadow: 
        0 10px 25px rgba(0,0,0,0.8), 
        0 0 20px var(--p-color),
        inset 0 0 10px var(--s-color);
    z-index: 2;
}

.agent-avatar-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.card-body {
    padding: 48px 20px 20px;
}

.agent-header-info {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 14px;
}

.agent-name {
    font-size: 19px;
    font-weight: 900;
    letter-spacing: -0.3px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
}

.agent-id {
    font-family: monospace;
    font-size: 11px;
    color: var(--text-muted);
    background: rgba(255, 255, 255, 0.05);
    padding: 2px 8px;
    border-radius: 6px;
    border: 1px solid rgba(255, 255, 255, 0.1);
}

/* KOTAK BIODATA FULL LENGKAP GENAP */
.bio-box-full {
    background: rgba(3, 5, 8, 0.85);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 14px;
    padding: 12px;
    margin-top: 10px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    box-shadow: inset 0 2px 8px rgba(0,0,0,0.5);
}

.bio-row {
    font-size: 11px;
    color: var(--text-muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.bio-row span {
    color: var(--text-main);
    font-weight: 700;
}

.agent-bio {
    font-size: 11px;
    color: #a1b5cb;
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px dashed rgba(255, 255, 255, 0.1);
    line-height: 1.4;
    font-style: italic;
}

.card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 14px;
    padding-top: 10px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
}

.status-indicator {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
}

.dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 10px var(--green);
}

.dot.offline {
    background: var(--offline-gray);
    box-shadow: none;
}

.edit-hint {
    font-size: 10px;
    font-weight: 800;
    color: var(--p-color);
    letter-spacing: 1px;
    text-shadow: 0 0 8px var(--aura-glow);
}

/* MODAL EDITOR */
.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(2, 4, 7, 0.88);
    backdrop-filter: blur(12px);
    z-index: 1000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.modal-overlay.active {
    display: flex;
}

.modal-container {
    width: 100%;
    max-width: 600px;
    max-height: 92vh;
    overflow-y: auto;
    background: var(--bg-surface);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 24px;
    padding: 24px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.9);
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.modal-title {
    font-size: 16px;
    font-weight: 800;
}

.modal-close {
    background: #0d1a26;
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: var(--text-main);
    width: 36px;
    height: 36px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.modal-close:hover {
    background: #e74c3c;
}

.preview-box {
    display: flex;
    align-items: center;
    gap: 16px;
    background: #04090f;
    border: 1px solid rgba(255, 255, 255, 0.1);
    padding: 14px;
    border-radius: 16px;
    margin-bottom: 18px;
}

.preview-img {
    width: 65px;
    height: 65px;
    border-radius: 14px;
    object-fit: cover;
    border: 2px solid rgba(255, 255, 255, 0.2);
}

.preview-info h4 {
    font-size: 15px;
    font-weight: 800;
}

.preview-info p {
    font-size: 10px;
    color: var(--text-muted);
    margin-top: 4px;
}

.btn-row {
    display: flex;
    gap: 8px;
    margin-top: 8px;
}

.mini-btn {
    background: #091522;
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: #35d9ff;
    font-size: 10px;
    font-weight: 700;
    padding: 6px 10px;
    border-radius: 8px;
    cursor: pointer;
}

.form-field {
    margin-bottom: 12px;
}

.form-field label {
    display: block;
    font-size: 10px;
    font-weight: 800;
    color: var(--text-muted);
    letter-spacing: 1.5px;
    margin-bottom: 5px;
}

.form-field input, 
.form-field textarea {
    width: 100%;
    background: #04090f;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 10px;
    padding: 10px 14px;
    color: var(--text-main);
    font-family: inherit;
    font-size: 13px;
    outline: none;
}

.form-field input:focus, 
.form-field textarea:focus {
    border-color: #ffd700;
}

.form-field textarea {
    resize: vertical;
    min-height: 65px;
}

.grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.status-switch-box {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #04090f;
    border: 1px solid rgba(255, 255, 255, 0.1);
    padding: 10px 14px;
    border-radius: 10px;
}

.status-switch-box span {
    font-size: 12px;
    font-weight: 700;
}

.status-switch-box input {
    width: auto;
    accent-color: #ffd700;
    cursor: pointer;
}

.save-action-btn {
    width: 100%;
    background: linear-gradient(135deg, #ffd700, #ff8800);
    color: #030508;
    border: none;
    padding: 13px;
    border-radius: 12px;
    font-weight: 900;
    letter-spacing: 1.5px;
    font-size: 12px;
    cursor: pointer;
    margin-top: 10px;
}

@media (max-width: 600px) {
    .wrapper { padding: 20px 12px 40px; }
    .grid-2 { grid-template-columns: 1fr; }
    .bio-box-full { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="wrapper">
    <div class="roster-header">
        <span>TEAM SNEXTY OFFICIAL</span>
        <h1>EPIC MYTHIC AURA ROSTER</h1>
        <p>Kotak kartu dan border avatar dirancang megah ala border game sultan dengan aura menyala penuh warna per role.</p>
    </div>

    <main class="roster-grid" id="rosterGrid"></main>
</div>

<!-- MODAL EDITOR -->
<div class="modal-overlay" id="editorModal">
    <div class="modal-container">
        <div class="modal-header">
            <div class="modal-title" id="modalHeading">EDIT BIODATA LENGKAP</div>
            <button class="modal-close" onclick="closeEditor()">×</button>
        </div>

        <div class="preview-box">
            <img id="modalPreviewImg" class="preview-img" alt="Avatar">
            <div class="preview-info">
                <h4 id="modalPreviewName">Agent</h4>
                <p>AVATAR AURA PREVIEW</p>
                <div class="btn-row">
                    <button class="mini-btn" onclick="document.getElementById('fileUpload').click()">UPLOAD</button>
                    <button class="mini-btn" onclick="clearAvatarPhoto()">RESET</button>
                </div>
            </div>
        </div>
        <input type="file" id="fileUpload" accept="image/*" hidden>

        <div class="grid-2">
            <div class="form-field">
                <label>NICKNAME</label>
                <input type="text" id="inputName" maxlength="30" placeholder="Nickname...">
            </div>
            <div class="form-field">
                <label>ID</label>
                <input type="text" id="inputID" maxlength="25" placeholder="SNX-XXXX">
            </div>
        </div>

        <div class="grid-2">
            <div class="form-field">
                <label>ROLE (GOLDLANER/MIDLANER/JUNGLER/ROAMER/SUB-ROAM/EXPLANER/COACH)</label>
                <input type="text" id="inputRole" maxlength="30" placeholder="Role...">
            </div>
            <div class="form-field">
                <label>ONLINE STATUS</label>
                <div class="status-switch-box">
                    <span id="statusTextDisplay">ONLINE</span>
                    <input type="checkbox" id="inputOnline">
                </div>
            </div>
        </div>

        <div class="grid-2">
            <div class="form-field">
                <label>MAKES (Makanan Kesukaan)</label>
                <input type="text" id="inputMakes" maxlength="40" placeholder="Contoh: Nasi Goreng">
            </div>
            <div class="form-field">
                <label>MIKES (Minuman Kesukaan)</label>
                <input type="text" id="inputMikes" maxlength="40" placeholder="Contoh: Es Teh">
            </div>
        </div>

        <div class="grid-2">
            <div class="form-field">
                <label>MUSKES (Musik Kesukaan)</label>
                <input type="text" id="inputMuskes" maxlength="40" placeholder="Contoh: Phonk">
            </div>
            <div class="form-field">
                <label>NORKES (Nonton Kesukaan)</label>
                <input type="text" id="inputNorkes" maxlength="40" placeholder="Contoh: Anime">
            </div>
        </div>

        <div class="grid-2">
            <div class="form-field">
                <label>HERKES (Hero Kesukaan)</label>
                <input type="text" id="inputHerkes" maxlength="40" placeholder="Contoh: Chou">
            </div>
            <div class="form-field">
                <label>HOBI</label>
                <input type="text" id="inputHobi" maxlength="40" placeholder="Contoh: Gaming">
            </div>
        </div>

        <div class="form-field">
            <label>BIO / QUOTES</label>
            <textarea id="inputBio" maxlength="150" placeholder="Tulis bio atau quotes gacor..."></textarea>
        </div>

        <button class="save-action-btn" onclick="commitChanges()">SIMPAN PERUBAHAN</button>
    </div>
</div>

<script>
const defaultRoster = [
    { name:"NevTryz", id:"SNX-NEV", role:"GOLDLANER", online:true, makes:"Nasi Goreng", mikes:"Es Teh", muskes:"Phonk", norkes:"Anime", herkes:"Claude", hobi:"Gaming", bio:"Different role. One squad. One goal." },
    { name:"Santaeee", id:"SNX-SAN", role:"MIDLANER", online:true, makes:"Bakso", mikes:"Matcha", muskes:"Lo-fi", norkes:"Series", herkes:"Pharsa", hobi:"Nonton", bio:"Stay sharp. Stay SNEXTY." },
    { name:"PARADOX", id:"SNX-PDX", role:"JUNGLER", online:false, makes:"Mie Ayam", mikes:"Kopi Hitam", muskes:"Rock", norkes:"Action", herkes:"Ling", hobi:"Olahraga", bio:"Play smart. Move different." },
    { name:"alfazira", id:"SNX-ALF", role:"ROAMER", online:true, makes:"Sate", mikes:"Jus Jeruk", muskes:"Pop", norkes:"Comedy", herkes:"Franco", hobi:"Scroll Tiktok", bio:"Calm mind, clean play." },
    { name:"™•strawberry", id:"SNX-STR", role:"SUB-ROAM", online:false, makes:"Dimsum", mikes:"Boba", muskes:"K-Pop", norkes:"Kdrama", herkes:"Mathilda", hobi:"Nyanyi", bio:"Sweet name. Serious game." },
    { name:"bokir abis", id:"SNX-BKR", role:"EXPLANER", online:true, makes:"Bubur Ayam", mikes:"Susu", muskes:"Jazz", norkes:"Podcast", herkes:"Chou", hobi:"Nongkrong", bio:"No noise. Just action." },
    { name:"Monarch x TNX", id:"SNX-COACH", role:"HEAD COACH", online:true, makes:"Steak", mikes:"Espresso", muskes:"Classical", norkes:"Documentary", herkes:"All Hero", hobi:"Analisis", bio:"Building the squad. Leading the vision." }
];

let rosterData = JSON.parse(localStorage.getItem("TEAM_SNEXTY_MYTHIC_ROSTER_V3")) || defaultRoster;
let currentEditIndex = 0;

const rosterGrid = document.getElementById("rosterGrid");
const editorModal = document.getElementById("editorModal");
const modalHeading = document.getElementById("modalHeading");
const modalPreviewImg = document.getElementById("modalPreviewImg");
const modalPreviewName = document.getElementById("modalPreviewName");
const fileUpload = document.getElementById("fileUpload");

const inputName = document.getElementById("inputName");
const inputID = document.getElementById("inputID");
const inputRole = document.getElementById("inputRole");
const inputOnline = document.getElementById("inputOnline");
const inputMakes = document.getElementById("inputMakes");
const inputMikes = document.getElementById("inputMikes");
const inputMuskes = document.getElementById("inputMuskes");
const inputNorkes = document.getElementById("inputNorkes");
const inputHerkes = document.getElementById("inputHerkes");
const inputHobi = document.getElementById("inputHobi");
const inputBio = document.getElementById("inputBio");
const statusTextDisplay = document.getElementById("statusTextDisplay");

function sanitizeHTML(str){
    return String(str ?? "").replace(/[&<>"']/g, function(m){
        return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#039;' }[m];
    });
}

function getRoleClass(roleStr){
    const r = (roleStr || "").toUpperCase();
    if(r.includes("GOLD")) return "role-goldlaner";
    if(r.includes("MID")) return "role-midlaner";
    if(r.includes("JUNGLE")) return "role-jungler";
    if(r.includes("SUB")) return "role-subroam";
    if(r.includes("ROAM")) return "role-roamer";
    if(r.includes("EXP")) return "role-explaner";
    if(r.includes("COACH") || r.includes("HEAD")) return "role-coach";
    return "role-goldlaner";
}

function generateSvgAvatar(name){
    const clean = name.replace(/[^a-zA-Z0-9]/g, "").substring(0, 2).toUpperCase() || "SN";
    return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><rect width="100%" height="100%" fill="#070d14"/><text x="50%" y="54%" text-anchor="middle" dominant-baseline="middle" fill="#ffd700" font-size="64" font-family="sans-serif" font-weight="900">${clean}</text></svg>`)}`;
}

function renderRoster(){
    rosterGrid.innerHTML = "";
    rosterData.forEach((agent, idx) => {
        const card = document.createElement("div");
        const roleClassName = getRoleClass(agent.role);
        card.className = `agent-card ${roleClassName}`;
        card.onclick = () => openEditor(idx);

        const avatarSrc = agent.photo || generateSvgAvatar(agent.name);

        card.innerHTML = `
            <div class="card-banner">
                <div class="agent-role">${sanitizeHTML(agent.role)}</div>
                <div class="agent-avatar-wrap">
                    <img src="${avatarSrc}" alt="${sanitizeHTML(agent.name)}">
                </div>
            </div>
            <div class="card-body">
                <div class="agent-header-info">
                    <div class="agent-name">${sanitizeHTML(agent.name)}</div>
                    <div class="agent-id">${sanitizeHTML(agent.id)}</div>
                </div>

                <div class="bio-box-full">
                    <div class="bio-row">Makes: <span>${sanitizeHTML(agent.makes || '-')}</span></div>
                    <div class="bio-row">Mikes: <span>${sanitizeHTML(agent.mikes || '-')}</span></div>
                    <div class="bio-row">Muskes: <span>${sanitizeHTML(agent.muskes || '-')}</span></div>
                    <div class="bio-row">Norkes: <span>${sanitizeHTML(agent.norkes || '-')}</span></div>
                    <div class="bio-row">Herkes: <span>${sanitizeHTML(agent.herkes || '-')}</span></div>
                    <div class="bio-row">Hobi: <span>${sanitizeHTML(agent.hobi || '-')}</span></div>
                </div>

                <div class="agent-bio">"${sanitizeHTML(agent.bio || "Belum ada bio.")}"</div>

                <div class="card-footer">
                    <div class="status-indicator">
                        <span class="dot ${agent.online ? '' : 'offline'}"></span>
                        ${agent.online ? 'ONLINE' : 'OFFLINE'}
                    </div>
                    <div class="edit-hint">EDIT ↗</div>
                </div>
            </div>
        `;
        rosterGrid.appendChild(card);
    });
}

function openEditor(idx){
    currentEditIndex = idx;
    const agent = rosterData[idx];

    modalHeading.textContent = "EDIT BIODATA • " + agent.name;
    inputName.value = agent.name || "";
    inputID.value = agent.id || "";
    inputRole.value = agent.role || "";
    inputOnline.checked = !!agent.online;
    inputMakes.value = agent.makes || "";
    inputMikes.value = agent.mikes || "";
    inputMuskes.value = agent.muskes || "";
    inputNorkes.value = agent.norkes || "";
    inputHerkes.value = agent.herkes || "";
    inputHobi.value = agent.hobi || "";
    inputBio.value = agent.bio || "";

    updateStatusLabel();
    modalPreviewName.textContent = agent.name;
    modalPreviewImg.src = agent.photo || generateSvgAvatar(agent.name);
    fileUpload.value = "";
    editorModal.classList.add("active");
}

function closeEditor(){
    editorModal.classList.remove("active");
}

function updateStatusLabel(){
    statusTextDisplay.textContent = inputOnline.checked ? "ONLINE" : "OFFLINE";
}

inputOnline.addEventListener("change", updateStatusLabel);

inputName.addEventListener("input", () => {
    modalPreviewName.textContent = inputName.value || "Agent";
});

fileUpload.addEventListener("change", (e) => {
    const file = e.target.files[0];
    if(!file) return;
    if(!file.type.startsWith("image/")){
        alert("File harus format gambar.");
        fileUpload.value = "";
        return;
    }
    if(file.size > 4 * 1024 * 1024){
        alert("Maksimal ukuran file 4MB.");
        fileUpload.value = "";
        return;
    }
    const reader = new FileReader();
    reader.onload = function(evt){
        modalPreviewImg.src = evt.target.result;
    };
    reader.readAsDataURL(file);
});

function clearAvatarPhoto(){
    rosterData[currentEditIndex].photo = "";
    modalPreviewImg.src = generateSvgAvatar(inputName.value);
    fileUpload.value = "";
}

function commitChanges(){
    const agent = rosterData[currentEditIndex];
    const newName = inputName.value.trim();
    const newID = inputID.value.trim();

    if(!newName){
        alert("Nickname tidak boleh kosong.");
        return;
    }
    if(!newID){
        alert("ID tidak boleh kosong.");
        return;
    }

    agent.name = newName;
    agent.id = newID;
    agent.role = inputRole.value.trim() || "MEMBER";
    agent.online = inputOnline.checked;
    agent.makes = inputMakes.value.trim();
    agent.mikes = inputMikes.value.trim();
    agent.muskes = inputMuskes.value.trim();
    agent.norkes = inputNorkes.value.trim();
    agent.herkes = inputHerkes.value.trim();
    agent.hobi = inputHobi.value.trim();
    agent.bio = inputBio.value.trim();

    const file = fileUpload.files[0];
    if(file){
        const reader = new FileReader();
        reader.onload = function(evt){
            agent.photo = evt.target.result;
            persistAndClose();
        };
        reader.readAsDataURL(file);
    } else {
        persistAndClose();
    }
}

function persistAndClose(){
    localStorage.setItem("TEAM_SNEXTY_MYTHIC_ROSTER_V3", JSON.stringify(rosterData));
    renderRoster();
    closeEditor();
}

editorModal.addEventListener("click", (e) => {
    if(e.target === editorModal) closeEditor();
});

document.addEventListener("keydown", (e) => {
    if(e.key === "Escape") closeEditor();
});

renderRoster();
</script>

</body>
</html>
