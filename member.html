<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROSTER TEAM SNEXTY - ULTIMATE EDITION</title>
<style>
/* ==========================================================================
   SNEXTY ULTIMATE DESIGN SYSTEM - 3000+ LINES EQUIVALENT ARCHITECTURE
   ========================================================================== */
:root {
    --bg-deep: #020408;
    --bg-surface: #070d14;
    --bg-card: #0b131d;
    --primary: #00f0ff;
    --primary-glow: rgba(0, 240, 255, 0.35);
    --accent: #7000ff;
    --text-main: #f0f6fc;
    --text-muted: #8b949e;
    --border-color: #1f3044;
    --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

*, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background-color: var(--bg-deep);
    color: var(--text-main);
    background-image: 
        radial-gradient(circle at 10% 10%, rgba(112,0,255,0.08) 0%, transparent 40%),
        radial-gradient(circle at 90% 90%, rgba(0,240,255,0.06) 0%, transparent 40%);
    overflow-x: hidden;
}

/* Background Particle Canvas Effect */
#matrixCanvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
    opacity: 0.25;
}

.app-wrapper {
    position: relative;
    z-index: 2;
    width: min(1350px, 100%);
    margin: 0 auto;
    padding: 40px 20px 80px;
}

/* HEADER UTAMA */
.main-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: linear-gradient(135deg, rgba(13,21,33,0.9), rgba(5,9,14,0.9));
    border: 1px solid var(--border-color);
    border-radius: 20px;
    padding: 24px 32px;
    margin-bottom: 40px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.1);
    backdrop-filter: blur(12px);
}

.brand-section {
    display: flex;
    align-items: center;
    gap: 20px;
}

.brand-logo {
    width: 65px;
    height: 65px;
    background: linear-gradient(145deg, #111f30, #04080d);
    border: 2px solid var(--primary);
    border-radius: 16px;
    display: grid;
    place-items: center;
    box-shadow: 0 0 25px var(--primary-glow);
    font-size: 20px;
    font-weight: 900;
    color: var(--primary);
    letter-spacing: 2px;
}

.brand-info h1 {
    font-size: 28px;
    font-weight: 900;
    letter-spacing: 1.5px;
    background: linear-gradient(90deg, #fff, var(--primary));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.brand-info p {
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 3px;
    margin-top: 4px;
    text-transform: uppercase;
}

.header-actions {
    display: flex;
    gap: 15px;
}

.cyber-btn {
    background: linear-gradient(135deg, #0d233a, #050e18);
    border: 1px solid var(--border-color);
    color: var(--text-main);
    padding: 12px 24px;
    border-radius: 12px;
    font-weight: 800;
    font-size: 12px;
    letter-spacing: 1px;
    cursor: pointer;
    transition: var(--transition-smooth);
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
}

.cyber-btn:hover {
    border-color: var(--primary);
    color: var(--primary);
    box-shadow: 0 0 20px var(--primary-glow);
    transform: translateY(-2px);
}

.cyber-btn.primary {
    background: linear-gradient(135deg, var(--accent), var(--primary));
    border: none;
    color: #fff;
    box-shadow: 0 5px 25px rgba(112,0,255,0.4);
}

.cyber-btn.primary:hover {
    opacity: 0.9;
    color: #fff;
    box-shadow: 0 0 30px var(--primary-glow);
}

/* GRID ROSTER KARTU */
.roster-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
    gap: 32px;
}

.roster-card {
    position: relative;
    background: var(--card-bg, #0b131d);
    border: 2.5px solid var(--card-border, #1f3044);
    border-radius: 24px;
    overflow: visible;
    box-shadow: 0 25px 50px rgba(0,0,0,0.7), 0 0 35px var(--card-aura, rgba(0,240,255,0.1));
    transition: var(--transition-smooth);
    cursor: pointer;
    margin-top: 20px;
}

.roster-card:hover {
    transform: translateY(-8px);
    box-shadow: 0 35px 70px rgba(0,0,0,0.8), 0 0 50px var(--card-aura, rgba(0,240,255,0.3));
    border-color: var(--primary);
}

.card-banner {
    height: 140px;
    position: relative;
    background: var(--cover-bg, linear-gradient(135deg, #142842, #060c14));
    border-top-left-radius: 21px;
    border-top-right-radius: 21px;
    border-bottom: 1px solid var(--border-color);
}

.role-tag {
    position: absolute;
    top: 15px;
    right: 15px;
    background: rgba(3, 7, 13, 0.85);
    border: 1px solid var(--border-color);
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 10px;
    font-weight: 900;
    letter-spacing: 1.5px;
    color: var(--primary);
    backdrop-filter: blur(5px);
}

/* AVATAR DENGAN 15 PILIHAN BORDER FUTURISTIK BERSEMI */
.avatar-container {
    position: absolute;
    left: 20px;
    bottom: -52px;
    width: 116px;
    height: 116px;
    z-index: 10;
}

.avatar-image {
    position: absolute;
    inset: 16px;
    width: calc(100% - 32px);
    height: calc(100% - 32px);
    border-radius: 50%;
    object-fit: cover;
    background: var(--bg-surface);
}

.avatar-border-svg {
    position: absolute;
    top: -14px;
    left: -14px;
    width: 144px;
    height: 144px;
    pointer-events: none;
    filter: drop-shadow(0 0 12px var(--primary-glow));
}

.card-body {
    padding: 70px 22px 22px;
}

.member-name {
    font-size: 21px;
    font-weight: 900;
    letter-spacing: 0.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.member-uid {
    font-family: monospace;
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 2px;
    letter-spacing: 1px;
}

.biodata-matrix {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px 12px;
    margin-top: 14px;
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.04);
    padding: 12px;
    border-radius: 14px;
}

.bio-cell {
    font-size: 11px;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.bio-cell span {
    color: var(--primary);
    font-weight: 700;
}

.member-quote {
    font-size: 11.5px;
    color: #a0aec0;
    margin-top: 12px;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid rgba(255,255,255,0.06);
}

.status-indicator {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    font-weight: 700;
    color: var(--text-muted);
}

.status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #00ff66;
    box-shadow: 0 0 10px #00ff66;
}

.status-dot.offline {
    background: #ff3333;
    box-shadow: none;
}

.edit-action-hint {
    font-size: 10px;
    font-weight: 900;
    color: var(--primary);
    letter-spacing: 1px;
}

/* MODAL EDITOR CANGGIH */
.cyber-modal {
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: rgba(2, 4, 8, 0.85);
    backdrop-filter: blur(20px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.cyber-modal.active {
    display: flex;
}

.modal-content-box {
    width: min(720px, 100%);
    max-height: 90vh;
    overflow-y: auto;
    background: linear-gradient(145deg, #0b131d, #04080d);
    border: 1px solid var(--border-color);
    border-radius: 28px;
    padding: 30px;
    box-shadow: 0 40px 100px rgba(0,0,0,0.9);
}

.modal-header-flex {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
}

.modal-title {
    font-size: 20px;
    font-weight: 900;
    letter-spacing: 1px;
}

.close-modal-btn {
    background: #111d2c;
    border: 1px solid var(--border-color);
    color: var(--text-main);
    width: 40px;
    height: 40px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 18px;
    font-weight: bold;
    display: grid;
    place-items: center;
}

.preview-customize-box {
    display: flex;
    align-items: center;
    gap: 20px;
    background: rgba(0,0,0,0.5);
    border: 1px solid var(--border-color);
    padding: 20px;
    border-radius: 20px;
    margin-bottom: 24px;
}

.preview-avatar-wrap {
    position: relative;
    width: 100px;
    height: 100px;
    flex-shrink: 0;
}

.preview-photo-el {
    position: absolute;
    inset: 14px;
    width: 72px;
    height: 72px;
    border-radius: 50%;
    object-fit: cover;
    background: var(--bg-surface);
}

.preview-border-svg-el {
    position: absolute;
    top: -10px;
    left: -10px;
    width: 120px;
    height: 120px;
    pointer-events: none;
}

.form-grid-stack {
    display: grid;
    gap: 16px;
}

.form-group-item label {
    display: block;
    font-size: 10px;
    font-weight: 900;
    letter-spacing: 1.5px;
    color: var(--text-muted);
    margin-bottom: 6px;
}

.cyber-input, .cyber-select, .cyber-textarea {
    width: 100%;
    background: #04080d;
    border: 1px solid var(--border-color);
    color: #fff;
    padding: 12px 16px;
    border-radius: 12px;
    font-family: inherit;
    font-size: 13px;
    outline: none;
    transition: var(--transition-smooth);
}

.cyber-input:focus, .cyber-select:focus, .cyber-textarea:focus {
    border-color: var(--primary);
    box-shadow: 0 0 15px var(--primary-glow);
}

.cyber-textarea {
    resize: vertical;
    min-height: 80px;
}

.grid-2-cols {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
}

.grid-3-cols {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
}

.section-divider-title {
    font-size: 11px;
    font-weight: 900;
    color: var(--primary);
    letter-spacing: 2px;
    margin: 12px 0 4px;
    border-bottom: 1px solid var(--border-color);
    padding-bottom: 6px;
}

.save-changes-btn {
    width: 100%;
    margin-top: 24px;
    background: linear-gradient(135deg, var(--accent), var(--primary));
    border: none;
    color: #fff;
    padding: 16px;
    border-radius: 14px;
    font-weight: 900;
    letter-spacing: 2px;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(112,0,255,0.4);
}

::-webkit-scrollbar {
    width: 8px;
}
::-webkit-scrollbar-track {
    background: var(--bg-deep);
}
::-webkit-scrollbar-thumb {
    background: var(--border-color);
    border-radius: 10px;
}
</style>
</head>
<body>

<canvas id="matrixCanvas"></canvas>

<div class="app-wrapper">
    <header class="main-header">
        <div class="brand-section">
            <div class="brand-logo">SNX</div>
            <div class="brand-info">
                <h1>ROSTER TEAM SNEXTY</h1>
                <p>ULTIMATE ESPORTS SQUAD DIRECTORY</p>
            </div>
        </div>
        <div class="header-actions">
            <button class="cyber-btn" onclick="exportDataJSON()">✦ EXPORT DATA</button>
            <button class="cyber-btn primary" onclick="openEditor(0)">✦ EDIT ROSTER</button>
        </div>
    </header>

    <main class="roster-grid" id="rosterContainer"></main>
</div>

<!-- MODAL EDITOR UTAMA -->
<div class="cyber-modal" id="editorModal">
    <div class="modal-content-box">
        <div class="modal-header-flex">
            <div class="modal-title" id="modalHeaderTitle">KUSTOMISASI KARTU</div>
            <button class="close-modal-btn" onclick="closeEditor()">×</button>
        </div>

        <div class="preview-customize-box">
            <div class="preview-avatar-wrap">
                <img id="previewPhotoEl" class="preview-photo-el" alt="Avatar">
                <div id="previewBorderSvgEl" class="preview-border-svg-el"></div>
            </div>
            <div>
                <h4 id="previewNameEl" style="font-size:18px; font-weight:900;">Nama Member</h4>
                <p style="font-size:10px; color:var(--text-muted); margin-top:2px;">PREVIEW BORDER 15 PILIHAN</p>
                <div style="display:flex; gap:8px; margin-top:10px;">
                    <button class="cyber-btn" style="padding:6px 12px; font-size:10px;" onclick="document.getElementById('fileUploadInput').click()">PILIH FOTO</button>
                    <button class="cyber-btn" style="padding:6px 12px; font-size:10px;" onclick="resetMemberPhoto()">RESET FOTO</button>
                </div>
            </div>
        </div>
        <input type="file" id="fileUploadInput" accept="image/*" hidden>

        <div class="form-grid-stack">
            <div class="section-divider-title">PENGATURAN WARNA KARTU & EFEK</div>
            <div class="grid-2-cols">
                <div class="form-group-item">
                    <label>WARNA LATAR KARTU</label>
                    <input type="color" id="cardBgColor" value="#0b131d" style="height:42px; padding:2px; cursor:pointer;" class="cyber-input">
                </div>
                <div class="form-group-item">
                    <label>WARNA BORDER UTAMA</label>
                    <input type="color" id="cardBorderColor" value="#1f3044" style="height:42px; padding:2px; cursor:pointer;" class="cyber-input">
                </div>
            </div>
            <div class="grid-2-cols">
                <div class="form-group-item">
                    <label>WARNA BANNER COVER</label>
                    <input type="color" id="coverBgColor" value="#142842" style="height:42px; padding:2px; cursor:pointer;" class="cyber-input">
                </div>
                <div class="form-group-item">
                    <label>WARNA AURA GLOW</label>
                    <input type="color" id="cardAuraColor" value="#00f0ff" style="height:42px; padding:2px; cursor:pointer;" class="cyber-input">
                </div>
            </div>

            <div class="section-divider-title">15 PILIHAN TEMA & MODEL BORDER AVATAR</div>
            <div class="grid-2-cols">
                <div class="form-group-item">
                    <label>PILIH TEMA BORDER</label>
                    <select id="borderThemeSelect" class="cyber-select" onchange="populateBorderStyles()">
                        <option value="mythic">🌟 Mythic & Winged Crown</option>
                        <option value="cyber">⚡ Cyberpunk Neon Grid</option>
                        <option value="quantum">🌀 Quantum Void Vortex</option>
                        <option value="draconic">🔥 Draconic Plasma Fire</option>
                        <option value="mecha">🛡️ Mecha Core Armor</option>
                    </select>
                </div>
                <div class="form-group-item">
                    <label>PILIH MODEL DESAIN</label>
                    <select id="borderModelSelect" class="cyber-select"></select>
                </div>
            </div>

            <div class="section-divider-title">IDENTITAS & ROLE SQUAD</div>
            <div class="grid-2-cols">
                <div class="form-group-item">
                    <label>NICKNAME</label>
                    <input type="text" id="inputName" class="cyber-input" placeholder="Nama in-game">
                </div>
                <div class="form-group-item">
                    <label>MEMBER ID</label>
                    <input type="text" id="inputId" class="cyber-input" placeholder="SNX-XXXX">
                </div>
            </div>

            <div class="grid-2-cols">
                <div class="form-group-item">
                    <label>ROLE TIM</label>
                    <input type="text" id="inputRole" class="cyber-input" placeholder="Jungler / Gold Laner">
                </div>
                <div class="form-group-item">
                    <label>STATUS KEAKTIFAN</label>
                    <div style="display:flex; justify-content:space-between; align-items:center; background:#04080d; border:1px solid var(--border-color); padding:11px 16px; border-radius:12px;">
                        <span id="statusTextIndicator" style="font-size:12px; font-weight:800;">ONLINE</span>
                        <input type="checkbox" id="inputOnline" style="width:18px; height:18px; accent-color:var(--primary); cursor:pointer;">
                    </div>
                </div>
            </div>

            <div class="section-divider-title">BIODATA LENGKAP DETAIL</div>
            <div class="grid-3-cols">
                <div class="form-group-item"><label>MAKES</label><input type="text" id="inputMakes" class="cyber-input" placeholder="Hero Favorit"></div>
                <div class="form-group-item"><label>MIKES</label><input type="text" id="inputMikes" class="cyber-input" placeholder="Device HP"></div>
                <div class="form-group-item"><label>IG</label><input type="text" id="inputIg" class="cyber-input" placeholder="@instagram"></div>
            </div>
            <div class="grid-3-cols">
                <div class="form-group-item"><label>HOBI</label><input type="text" id="inputHobi" class="cyber-input" placeholder="Hobi Anda"></div>
                <div class="form-group-item"><label>NORKES</label><input type="text" id="inputNorkes" class="cyber-input" placeholder="No. Kontak"></div>
                <div class="form-group-item"><label>MUSKES</label><input type="text" id="inputMuskes" class="cyber-input" placeholder="Genre Musik"></div>
            </div>
            <div class="form-group-item">
                <label>BIO / QUOTE UTAMA</label>
                <textarea id="inputBio" class="cyber-textarea" placeholder="Tulis quote andalan member..."></textarea>
            </div>
        </div>

        <button class="save-changes-btn" onclick="saveMemberData()">SIMPAN PERUBAHAN</button>
    </div>
</div>

<script>
/* ==========================================================================
   15 BORDER VARIATIONS & SVG DATA ENGINE (FUTURISTIK & BERSENI)
   ========================================================================== */
const borderDatabase = {
    mythic: [
        { id: 1, name: "01. Royal Crystal Wings", svg: `<svg viewBox="0 0 120 120" width="100%" height="100%"><path d="M60 2 L76 20 L108 10 L94 44 L118 60 L94 76 L108 110 L76 100 L60 118 L44 100 L12 110 L26 76 L2 60 L26 44 L12 10 L44 20 Z" fill="none" stroke="url(#gM1)" stroke-width="5.5"/><circle cx="60" cy="60" r="46" fill="none" stroke="#fff" stroke-width="1.5" stroke-dasharray="6 3"/><defs><linearGradient id="gM1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fff"/><stop offset="100%" stop-color="#ffaa00"/></linearGradient></defs></svg>` },
        { id: 2, name: "02. Celestial Star Crown", svg: `<svg viewBox="0 0 120 120" width="100%" height="100%"><polygon points="60,2 74,38 114,38 82,62 94,98 60,76 26,98 38,62 6,38 46,38" fill="none" stroke="#00f0ff" stroke-width="5.5"/><circle cx="60" cy="60" r="44" fill="none" stroke="#fff" stroke-width="2"/></svg>` },
        { id: 3, name: "03. Sovereign Diamond Ring", svg: `<svg viewBox="0 0 120 120" width="100%" height="100%"><rect x="12" y="12" width="96" height="96" rx="24" fill="none" stroke="url(#gM3)" stroke-width="5.5"/><circle cx="60" cy="60" r="45" fill="none" stroke="#ffaa00" stroke-width="1.5" stroke-dasharray="8 4"/><defs><linearGradient id="gM3" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffea75"/><stop offset="100%" stop-color="#b87314"/></linearGradient></defs></svg>` }
    ],
    cyber: [
        { id: 4, name: "04. Cyberpunk Neon Frame", svg: `<svg viewBox="0 0 120 120" width="100%" height="100%"><path d="M15 15 L105 15 L105 105 L15 105 Z" fill="none" stroke="#00f0ff" stroke-width="5"/><path d="M5 40 L5 5 L40 5" fill="none" stroke="#ff0055" stroke-width="6"/><path d="M115 80 L115 115 L80 115" fill="none" stroke="#ff0055" stroke-width="6"/><circle cx="60" cy="60" r="46" fill="none" stroke="#00f0ff" stroke-width="2" stroke-dasharray="5 5"/></svg>` },
        { id: 5, name: "05. Matrix Grid Hexagon", svg: `<svg viewBox="0 0 120 120" width="100%" height="100%"><polygon points="60,4 112,32 112,88 60,116 8,88 8,32" fill="none" stroke="#00ff66" stroke-width="5"/><circle cx="60" cy="60" r="44" fill="none" stroke="#00ff66" stroke-width="1.5"/></svg>` },
        { id: 6, name: "06. Neural Pulse Circuit", svg: `<svg viewBox="0 0 120 120" width="100%" height="100%"><rect x="10" y="10" width="100" height="100" rx="12" fill="none" stroke="#7000ff" stroke-width="5"/><circle cx="60" cy="60" r="48" fill="none" stroke="#00f0ff" stroke-width="2" stroke-dasharray="10 3"/></svg>` }
    ],
    quantum: [
        { id: 7, name: "07. Quantum Void Spiral", svg: `<svg viewBox="0 0 120 120" width="100%" height="100%"><circle cx="60" cy="60" r="50" fill="none" stroke="#bd00ff" stroke-width="5.5"/><path d="M20 20 Q60 10 100 20 Q110 60 100 100 Q60 110 20 100 Q10 60 20 20" fill="none" stroke="#00f0ff" stroke-width="2" stroke-dasharray="6 6"/></svg>` },
        { id: 8, name: "08. Singularity Ring", svg: `<svg viewBox="0 0 120 120" width="100%" height="100%"><ellipse cx="60" cy="60" rx="52" ry="32" transform="rotate(45 60 60)" fill="none" stroke="#00f0ff" stroke-width="5"/><ellipse cx="60" cy="60" rx="52" ry="32" transform="rotate(-45 60 60)" fill="none" stroke="#ff00aa" stroke-width="5"/></svg>` },
        { id: 9, name: "09. Cosmic Event Horizon", svg: `<svg viewBox="0 0 120 120" width="100%" height="100%"><circle cx="60" cy="60" r="48" fill="none" stroke="url(#gQ9)" stroke-width="6"/><circle cx="60" cy="60" r="38" fill="none" stroke="#ffffff" stroke-width="1"/><defs><linearGradient id="gQ9" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#00f0ff"/><stop offset="100%" stop-color="#7000ff"/></linearGradient></defs></svg>` }

/* INISIALISASI MATRIX PARTICLE BACKGROUND */
const canvas = document.getElementById("matrixCanvas");
const ctx = canvas.getContext("2d");
let w = canvas.width = window.innerWidth;
let h = canvas.height = window.innerHeight;

window.addEventListener("resize", () => {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
});

const particles = Array.from({ length: 45 }, () => ({
    x: Math.random() * w,
    y: Math.random() * h,
    size: Math.random() * 2 + 1,
    speedY: (Math.random() - 0.5) * 0.5,
    speedX: (Math.random() - 0.5) * 0.5
}));

function animateMatrix() {
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = "rgba(0, 240, 255, 0.4)";
    particles.forEach(p => {
        p.x += p.speedX;
        p.y += p.speedY;
        if(p.x < 0) p.x = w; if(p.x > w) p.x = 0;
        if(p.y < 0) p.y = h; if(p.y > h) p.y = 0;
        ctx.fillRect(p.x, p.y, p.size, p.size);
    });
    requestAnimationFrame(animateMatrix);
}
animateMatrix();

/* RENDER UTAMA KARTU ROSTER */
function getSvgMarkup(themeKey, styleIdNum) {
    const group = borderDatabase[themeKey] || borderDatabase.mythic;
    const item = group.find(x => x.id == styleIdNum) || group[0];
    return item.svg;
}

function getFallbackAvatar(nameText) {
    const initials = (nameText.replace(/[^a-zA-Z0-9]/g, "").substring(0,2).toUpperCase() || "SN");
    return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300"><rect width="100%" height="100%" fill="#070d14"/><text x="50%" y="54%" text-anchor="middle" dominant-baseline="middle" fill="#00f0ff" font-size="80" font-family="sans-serif" font-weight="900">${initials}</text></svg>`)}`;
}

function renderRosterCards() {
    const container = document.getElementById("rosterContainer");
    container.innerHTML = "";

    teamMembers.forEach((mem, idx) => {
        const card = document.createElement("article");
        card.className = "roster-card";
        card.style.setProperty("--card-bg", mem.cardBg || "#0b131d");
        card.style.setProperty("--cover-bg", mem.coverBg || "#142842");
        card.style.setProperty("--card-border", mem.cardBorder || "#1f3044");
        card.style.setProperty("--card-aura", mem.auraColor || "rgba(0,240,255,0.15)");
        card.onclick = () => openEditor(idx);

        const photoSrc = mem.photo || getFallbackAvatar(mem.name);
        const svgContent = getSvgMarkup(mem.theme || "mythic", mem.styleId || 1);

        card.innerHTML = `
            <div class="card-banner">
                <div class="role-tag">${escapeHtml(mem.role)}</div>
                <div class="avatar-container">
                    <img class="avatar-image" src="${photoSrc}" alt="${escapeHtml(mem.name)}">
                    <div class="avatar-border-svg">${svgContent}</div>
                </div>
            </div>
            <div class="card-body">
                <div class="member-name">${escapeHtml(mem.name)}</div>
                <div class="member-uid">${escapeHtml(mem.id)}</div>
                
                <div class="biodata-matrix">
                    <div class="bio-cell">Makes: <span>${escapeHtml(mem.makes || '-')}</span></div>
                    <div class="bio-cell">Mikes: <span>${escapeHtml(mem.mikes || '-')}</span></div>
                    <div class="bio-cell">IG: <span>${escapeHtml(mem.ig || '-')}</span></div>
                    <div class="bio-cell">Hobi: <span>${escapeHtml(mem.hobi || '-')}</span></div>
                    <div class="bio-cell">Norkes: <span>${escapeHtml(mem.norkes || '-')}</span></div>
                    <div class="bio-cell">Muskes: <span>${escapeHtml(mem.muskes || '-')}</span></div>
                </div>

                <div class="member-quote">${escapeHtml(mem.bio || "No quote registered.")}</div>

                <div class="card-footer">
                    <div class="status-indicator">
                        <span class="status-dot ${mem.online ? '' : 'offline'}"></span>
                        ${mem.online ? 'ONLINE' : 'OFFLINE'}
                    </div>
                    <div class="edit-action-hint">EDIT CONFIG ↗</div>
                </div>
            </div>
        `;
        container.appendChild(card);
    });
}

function escapeHtml(str) {
    return String(str || "").replace(/[&<>"']/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#039;' }[m]));
}

/* KONTROL MODAL EDITOR */
const editorModal = document.getElementById("editorModal");
const inputName = document.getElementById("inputName");
const inputId = document.getElementById("inputId");

const inputBio = document.getElementById("inputBio");
const inputOnline = document.getElementById("inputOnline");
const fileUploadInput = document.getElementById("fileUploadInput");

const previewPhotoEl = document.getElementById("previewPhotoEl");
const previewBorderSvgEl = document.getElementById("previewBorderSvgEl");
const previewNameEl = document.getElementById("previewNameEl");
const statusTextIndicator = document.getElementById("statusTextIndicator");

const cardBgColor = document.getElementById("cardBgColor");
const cardBorderColor = document.getElementById("cardBorderColor");
const coverBgColor = document.getElementById("coverBgColor");
const cardAuraColor = document.getElementById("cardAuraColor");
const borderThemeSelect = document.getElementById("borderThemeSelect");
const borderModelSelect = document.getElementById("borderModelSelect");

const inputMakes = document.getElementById("inputMakes");
const inputMikes = document.getElementById("inputMikes");
const inputIg = document.getElementById("inputIg");
const inputHobi = document.getElementById("inputHobi");
const inputNorkes = document.getElementById("inputNorkes");
const inputMuskes = document.getElementById("inputMuskes");

function populateBorderStyles() {
    const themeKey = borderThemeSelect.value;
    const styles = borderDatabase[themeKey] || borderDatabase.mythic;
    borderModelSelect.innerHTML = "";
    styles.forEach(st => {
        const opt = document.createElement("option");
        opt.value = st.id;
        opt.textContent = st.name;
        borderModelSelect.appendChild(opt);
    });
    updatePreviewVisuals();
}

borderModelSelect.addEventListener("change", updatePreviewVisuals);
cardAuraColor.addEventListener("input", updatePreviewVisuals);
inputName.addEventListener("input", () => {
    previewNameEl.textContent = inputName.value || "Member";
    updatePreviewVisuals();
});

function updatePreviewVisuals() {
    previewBorderSvgEl.innerHTML = getSvgMarkup(borderThemeSelect.value, borderModelSelect.value);
}

function openEditor(index) {
    activeEditingIndex = index;
    const mem = teamMembers[index];

    document.getElementById("modalHeaderTitle").textContent = "EDIT • " + mem.name;

    inputName.value = mem.name;
    inputId.value = mem.id;
    inputRole.value = mem.role;
    inputBio.value = mem.bio;
    inputOnline.checked = mem.online;

    inputMakes.value = mem.makes || "";
    inputMikes.value = mem.mikes || "";
    inputIg.value = mem.ig || "";
    inputHobi.value = mem.hobi || "";
    inputNorkes.value = mem.norkes || "";
    inputMuskes.value = mem.muskes || "";

    cardBgColor.value = mem.cardBg || "#0b131d";
    cardBorderColor.value = mem.cardBorder || "#1f3044";
    coverBgColor.value = mem.coverBg || "#142842";
    cardAuraColor.value = mem.auraColor || "#00f0ff";

    borderThemeSelect.value = mem.theme || "mythic";
    populateBorderStyles();
    borderModelSelect.value = mem.styleId || 1;

    previewPhotoEl.src = mem.photo || getFallbackAvatar(mem.name);
    previewNameEl.textContent = mem.name;
    fileUploadInput.value = "";
    updateStatusTextIndicator();
    updatePreviewVisuals();

    editorModal.classList.add("active");
}

function closeEditor() {
    editorModal.classList.remove("active");
}

function updateStatusTextIndicator() {
    statusTextIndicator.textContent = inputOnline.checked ? "ONLINE" : "OFFLINE";
}
inputOnline.addEventListener("change", updateStatusTextIndicator);

fileUploadInput.addEventListener("change", (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => { previewPhotoEl.src = ev.target.result; };
    reader.readAsDataURL(file);
});

function resetMemberPhoto() {
    teamMembers[activeEditingIndex].photo = "";
    previewPhotoEl.src = getFallbackAvatar(inputName.value);
    fileUploadInput.value = "";
}

function saveMemberData() {
    const mem = teamMembers[activeEditingIndex];
    if(!inputName.value.trim() || !inputId.value.trim()) {
        alert("Nama dan Member ID wajib diisi!");
        return;
    }

    mem.name = inputName.value.trim();
    mem.id = inputId.value.trim();
    mem.role = inputRole.value.trim() || "MEMBER";
    mem.bio = inputBio.value.trim();
    mem.online = inputOnline.checked;

    mem.makes = inputMakes.value.trim();
    mem.mikes = inputMikes.value.trim();
    mem.ig = inputIg.value.trim();
    mem.hobi = inputHobi.value.trim();
    mem.norkes = inputNorkes.value.trim();
    mem.muskes = inputMuskes.value.trim();

    mem.cardBg = cardBgColor.value;
    mem.cardBorder = cardBorderColor.value;
    mem.coverBg = coverBgColor.value;
    mem.auraColor = cardAuraColor.value;

    mem.theme = borderThemeSelect.value;
    mem.styleId = parseInt(borderModelSelect.value);

    const file = fileUploadInput.files[0];
    if(file) {
        const reader = new FileReader();
        reader.onload = (ev) => {
            mem.photo = ev.target.result;
            commitAndClose();
        };
        reader.readAsDataURL(file);
    } else {
        commitAndClose();
    }
}

function commitAndClose() {
    localStorage.setItem("SNEXTY_ULTIMATE_DB", JSON.stringify(teamMembers));
    renderRosterCards();
    closeEditor();
}

function exportDataJSON() {
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(teamMembers, null, 2));
    const downloadAnchor = document.createElement('a');
    downloadAnchor.setAttribute("href", dataStr);
    downloadAnchor.setAttribute("download", "snexty_roster_backup.json");
    document.body.appendChild(downloadAnchor);
    downloadAnchor.click();
    downloadAnchor.remove();
}

editorModal.addEventListener("click", (e) => { if(e.target === editorModal) closeEditor(); });
document.addEventListener("keydown", (e) => { if(e.key === "Escape") closeEditor(); });
