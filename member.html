<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEAM SNEXTY — Aura Roster Pro</title>
<style>
:root {
    --bg-base: #030507;
    --bg-surface: #070d14;
    --bg-card: #09121c;
    --border-color: #15293d;
    --border-glow: #21517a;
    --primary: #168cff;
    --cyan: #35d9ff;
    --cyan-glow: rgba(53, 217, 255, 0.25);
    --text-main: #f0f6fc;
    --text-muted: #8397ad;
    --green: #2ecc71;
    --offline-gray: #4a596a;
}

/* AURA WARNA KHUSUS BERDASARKAN ROLE */
/* 1. GOLDLANER: Kuning Emas Elegan / Gold */
.role-goldlaner { --aura-color: #ffd700; --aura-glow: rgba(255, 215, 0, 0.4); }
/* 2. MIDLANER: Ungu Magis / Mystic Purple */
.role-midlaner { --aura-color: #b026ff; --aura-glow: rgba(176, 38, 255, 0.45); }
/* 3. JUNGLER: Merah Menyala / Blood Red */
.role-jungler { --aura-color: #ff3333; --aura-glow: rgba(255, 51, 51, 0.45); }
/* 4. ROAMER: Hijau Toksik / Toxic Green */
.role-roamer { --aura-color: #00ff66; --aura-glow: rgba(0, 255, 102, 0.45); }
/* 5. SUB-ROAM / SUB: Cyan Terang / Cyber Blue */
.role-subroam { --aura-color: #00ffff; --aura-glow: rgba(0, 255, 255, 0.45); }
/* 6. EXP LANER: Oranye Api / Blaze Orange */
.role-explaner { --aura-color: #ff8800; --aura-glow: rgba(255, 136, 0, 0.45); }
/* 7. HEAD COACH: Pink Magenta / Elite Boss */
.role-coach { --aura-color: #ff007f; --aura-glow: rgba(255, 0, 127, 0.45); }

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background-color: var(--bg-base);
    color: var(--text-main);
    background-image: 
        radial-gradient(circle at 15% 10%, rgba(22, 140, 255, 0.12), transparent 35%),
        radial-gradient(circle at 85% 90%, rgba(53, 217, 255, 0.08), transparent 40%);
    background-attachment: fixed;
    overflow-x: hidden;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image: 
        linear-gradient(to right, rgba(21, 41, 61, 0.15) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(21, 41, 61, 0.15) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: -1;
}

.wrapper {
    max-width: 1280px;
    margin: 0 auto;
    padding: 30px 20px 60px;
}

.command-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(7, 13, 20, 0.85);
    border: 1px solid var(--border-color);
    backdrop-filter: blur(12px);
    padding: 16px 24px;
    border-radius: 16px;
    margin-bottom: 35px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
}

.brand-group {
    display: flex;
    align-items: center;
    gap: 15px;
}

.brand-icon {
    width: 48px;
    height: 48px;
    background: linear-gradient(135deg, #0b1e30, #04090f);
    border: 1px solid var(--border-glow);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    color: var(--cyan);
    font-size: 15px;
    box-shadow: 0 0 15px var(--cyan-glow);
}

.brand-text h2 {
    font-size: 18px;
    letter-spacing: 1.5px;
    font-weight: 800;
}

.brand-text p {
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 2px;
}

.nav-actions {
    display: flex;
    gap: 12px;
}

.cyber-btn {
    background: #091522;
    border: 1px solid var(--border-glow);
    color: var(--cyan);
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: all 0.25s ease;
}

.cyber-btn:hover {
    background: var(--primary);
    color: #fff;
    border-color: var(--cyan);
    box-shadow: 0 0 20px var(--cyan-glow);
    transform: translateY(-2px);
}

.roster-header {
    text-align: center;
    margin-bottom: 40px;
}

.roster-header span {
    color: var(--cyan);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 4px;
    text-transform: uppercase;
    background: rgba(53, 217, 255, 0.08);
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid rgba(53, 217, 255, 0.2);
}

.roster-header h1 {
    font-size: clamp(28px, 5vw, 42px);
    font-weight: 900;
    margin-top: 15px;
    letter-spacing: -0.5px;
    background: linear-gradient(180deg, #fff, #91b5d6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.roster-header p {
    color: var(--text-muted);
    font-size: 14px;
    max-width: 550px;
    margin: 10px auto 0;
    line-height: 1.6;
}

.roster-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 24px;
}

/* AGENT CARD DENGAN AURA KUSTOM BERDASARKAN ROLE */
.agent-card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 22px;
    overflow: hidden;
    position: relative;
    cursor: pointer;
    transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
}

.agent-card:hover {
    transform: translateY(-8px);
    border-color: var(--aura-color);
    box-shadow: 0 22px 50px rgba(0, 0, 0, 0.7), 0 0 30px var(--aura-glow);
}

.card-banner {
    height: 120px;
    background: linear-gradient(135deg, rgba(13, 35, 58, 0.9), #050a12);
    position: relative;
    display: flex;
    justify-content: flex-end;
    padding: 12px;
    border-bottom: 2px solid var(--aura-color);
    box-shadow: inset 0 -10px 20px rgba(0,0,0,0.5);
}

.agent-role {
    background: rgba(3, 5, 7, 0.9);
    border: 1px solid var(--aura-color);
    color: var(--aura-color);
    font-size: 10px;
    font-weight: 900;
    padding: 6px 12px;
    border-radius: 8px;
    letter-spacing: 1.2px;
    height: fit-content;
    box-shadow: 0 0 12px var(--aura-glow);
}

.agent-avatar-wrap {
    position: absolute;
    left: 20px;
    bottom: -36px;
    width: 86px;
    height: 86px;
    border-radius: 18px;
    border: 3px solid var(--aura-color);
    background: var(--bg-surface);
    overflow: hidden;
    box-shadow: 0 8px 25px rgba(0,0,0,0.7), 0 0 18px var(--aura-glow);
}

.agent-avatar-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.card-body {
    padding: 48px 20px 20px;
}

.agent-name {
    font-size: 19px;
    font-weight: 900;
    letter-spacing: -0.3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.agent-id {
    font-family: monospace;
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 3px;
}

/* KOTAK INFORMASI BIODATA LENGKAP DI DALAM CARD */
.bio-grid-preview {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 14px;
    background: rgba(3, 7, 12, 0.6);
    border: 1px solid var(--border-color);
    padding: 10px;
    border-radius: 12px;
}

.bio-item {
    font-size: 10px;
    color: var(--text-muted);
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.bio-item strong {
    color: var(--cyan);
    font-weight: 700;
}

.agent-bio {
    font-size: 11px;
    color: #a1b5cb;
    margin-top: 10px;
    line-height: 1.45;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 16px;
    padding-top: 12px;
    border-top: 1px solid var(--border-color);
}

.status-indicator {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
}

.dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 10px var(--green);
}

.dot.offline {
    background: var(--offline-gray);
    box-shadow: none;
}

.edit-hint {
    font-size: 10px;
    font-weight: 800;
    color: var(--cyan);
    letter-spacing: 1px;
}

/* MODAL EDITOR LENGKAP */
.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(2, 4, 7, 0.85);
    backdrop-filter: blur(12px);
    z-index: 1000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.modal-overlay.active {
    display: flex;
}

.modal-container {
    width: 100%;
    max-width: 600px;
    max-height: 92vh;
    overflow-y: auto;
    background: var(--bg-surface);
    border: 1px solid var(--border-glow);
    border-radius: 24px;
    padding: 24px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.9), 0 0 35px var(--cyan-glow);
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.modal-title {
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 0.5px;
}

.modal-close {
    background: #0d1a26;
    border: 1px solid var(--border-color);
    color: var(--text-main);
    width: 36px;
    height: 36px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.2s;
}

.modal-close:hover {
    background: #e74c3c;
    border-color: #e74c3c;
}

.preview-box {
    display: flex;
    align-items: center;
    gap: 16px;
    background: #04090f;
    border: 1px solid var(--border-color);
    padding: 14px;
    border-radius: 16px;
    margin-bottom: 18px;
}

.preview-img {
    width: 65px;
    height: 65px;
    border-radius: 14px;
    object-fit: cover;
    border: 2px solid var(--border-glow);
}

.preview-info h4 {
    font-size: 15px;
    font-weight: 800;
}

.preview-info p {
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 1px;
    margin-top: 4px;
}

.btn-row {
    display: flex;
    gap: 8px;
    margin-top: 8px;
}

.mini-btn {
    background: #091522;
    border: 1px solid var(--border-glow);
    color: var(--cyan);
    font-size: 10px;
    font-weight: 700;
    padding: 6px 10px;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.2s;
}

.mini-btn:hover {
    background: var(--primary);
    color: #fff;
}

.form-field {
    margin-bottom: 12px;
}

.form-field label {
    display: block;
    font-size: 10px;
    font-weight: 800;
    color: var(--text-muted);
    letter-spacing: 1.5px;
    margin-bottom: 5px;
}

.form-field input, 
.form-field textarea {
    width: 100%;
    background: #04090f;
    border: 1px solid var(--border-color);
    border-radius: 10px;
    padding: 10px 14px;
    color: var(--text-main);
    font-family: inherit;
    font-size: 13px;
    outline: none;
    transition: 0.2s;
}

.form-field input:focus, 
.form-field textarea:focus {
    border-color: var(--cyan);
    box-shadow: 0 0 12px var(--cyan-glow);
}

.form-field textarea {
    resize: vertical;
    min-height: 65px;
}

.grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.status-switch-box {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #04090f;
    border: 1px solid var(--border-color);
    padding: 10px 14px;
    border-radius: 10px;
}

.status-switch-box span {
    font-size: 12px;
    font-weight: 700;
}

.status-switch-box input {
    width: auto;
    accent-color: var(--cyan);
    cursor: pointer;
}

.save-action-btn {
    width: 100%;
    background: linear-gradient(135deg, var(--primary), var(--cyan));
    color: #fff;
    border: none;
    padding: 13px;
    border-radius: 12px;
    font-weight: 900;
    letter-spacing: 1.5px;
    font-size: 12px;
    cursor: pointer;
    margin-top: 10px;
    box-shadow: 0 8px 25px rgba(22, 140, 255, 0.3);
    transition: 0.2s;
}

.save-action-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 30px rgba(53, 217, 255, 0.4);
}

@media (max-width: 600px) {
    .wrapper { padding: 15px 12px 40px; }
    .grid-2 { grid-template-columns: 1fr; }
    .bio-grid-preview { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="wrapper">
    <header class="command-bar">
        <div class="brand-group">
            <div class="brand-icon">TNEX</div>
            <div class="brand-text">
                <h2>TEAM SNEXTY</h2>
                <p>Elite Roster Registry</p>
            </div>
        </div>
        <div class="nav-actions">
            <a href="home (1).html" class="cyber-btn">⌂ HOME</a>
             <button onclick="window.location.href='home.html'">
    </header>

    <div class="roster-header">
        <span>AURA SQUAD REGISTRY</span>
        <h1>TACTICAL BIODATA</h1>
        <p>Setiap member memiliki aura dan efek border unik sesuai rolenya (Roamer vs Sub-Roam dibedakan!). Ketuk kartu untuk mengedit biodata lengkap.</p>
    </div>

    <main class="roster-grid" id="rosterGrid"></main>
</div>

<!-- EDITOR MODAL LENGKAP -->
<div class="modal-overlay" id="editorModal">
    <div class="modal-container">
        <div class="modal-header">
            <div class="modal-title" id="modalHeading">EDIT AGENT BIO</div>
            <button class="modal-close" onclick="closeEditor()">×</button>
        </div>

        <div class="preview-box">
            <img id="modalPreviewImg" class="preview-img" alt="Avatar">
            <div class="preview-info">
                <h4 id="modalPreviewName">Agent</h4>
                <p>AVATAR AURA PREVIEW</p>
                <div class="btn-row">
                    <button class="mini-btn" onclick="document.getElementById('fileUpload').click()">UPLOAD</button>
                    <button class="mini-btn" onclick="clearAvatarPhoto()">RESET</button>
                </div>
            </div>
        </div>
        <input type="file" id="fileUpload" accept="image/*" hidden>

        <div class="grid-2">
            <div class="form-field">
                <label>NICKNAME</label>
                <input type="text" id="inputName" maxlength="30" placeholder="Nickname...">
            </div>
            <div class="form-field">
                <label>ID</label>
                <input type="text" id="inputID" maxlength="25" placeholder="SNX-XXXX">
            </div>
        </div>

        <div class="grid-2">
            <div class="form-field">
                <label>ROLE (Ketik: GOLDLANER / MIDLANER / JUNGLER / ROAMER / SUB-ROAM / EXPLANER / COACH)</label>
                <input type="text" id="inputRole" maxlength="30" placeholder="Role member...">
            </div>
            <div class="form-field">
                <label>ONLINE STATUS</label>
                <div class="status-switch-box">
                    <span id="statusTextDisplay">ONLINE</span>
                    <input type="checkbox" id="inputOnline">
                </div>
            </div>
        </div>

        <div class="grid-2">
            <div class="form-field">
                <label>MAKES (Makanan Kesukaan)</label>
                <input type="text" id="inputMakes" maxlength="40" placeholder="Contoh: Nasi Goreng">
            </div>
            <div class="form-field">
                <label>MIKES (Minuman Kesukaan)</label>
                <input type="text" id="inputMikes" maxlength="40" placeholder="Contoh: Es Teh Manis">
            </div>
        </div>

        <div class="grid-2">
            <div class="form-field">
                <label>MUSKES (Musik Kesukaan)</label>
                <input type="text" id="inputMuskes" maxlength="40" placeholder="Contoh: Phonk / Pop">
            </div>
            <div class="form-field">
                <label>NORKES (Nonton Kesukaan)</label>
                <input type="text" id="inputNorkes" maxlength="40" placeholder="Contoh: Anime / Turnamen">
            </div>
        </div>

        <div class="grid-2">
            <div class="form-field">
                <label>HERKES (Hero Kesukaan)</label>
                <input type="text" id="inputHerkes" maxlength="40" placeholder="Contoh: Chou / Ling">
            </div>
            <div class="form-field">
                <label>HOBI</label>
                <input type="text" id="inputHobi" maxlength="40" placeholder="Contoh: Main Game / Tidur">
            </div>
        </div>

        <div class="form-field">
            <label>BIO / QUOTES</label>
            <textarea id="inputBio" maxlength="150" placeholder="Tulis bio atau kata-kata gacor..."></textarea>
        </div>

        <button class="save-action-btn" onclick="commitChanges()">SIMPAN BIODATA</button>
    </div>
</div>

<script>
const defaultRoster = [
    { name:"NevTryz", id:"SNX-NEV", role:"GOLDLANER", online:true, makes:"Nasi Goreng", mikes:"Es Teh", muskes:"Phonk", norkes:"Anime", herkes:"Claude", hobi:"Gaming", bio:"Different role. One squad. One goal." },
    { name:"Santaeee", id:"SNX-SAN", role:"MIDLANER", online:true, makes:"Bakso", mikes:"Matcha", muskes:"Lo-fi", norkes:"Series", herkes:"Pharsa", hobi:"Nonton", bio:"Stay sharp. Stay SNEXTY." },
    { name:"PARADOX", id:"SNX-PDX", role:"JUNGLER", online:false, makes:"Mie Ayam", mikes:"Kopi Hitam", muskes:"Rock", norkes:"Action", herkes:"Ling", hobi:"Olahraga", bio:"Play smart. Move different." },
    { name:"alfazira", id:"SNX-ALF", role:"ROAMER", online:true, makes:"Sate", mikes:"Jus Jeruk", muskes:"Pop", norkes:"Comedy", herkes:"Franco", hobi:"Scroll Tiktok", bio:"Calm mind, clean play." },
    { name:"™•strawberry", id:"SNX-STR", role:"SUB-ROAM", online:false, makes:"Dimsum", mikes:"Boba", muskes:"K-Pop", norkes:"Kdrama", herkes:"Mathilda", hobi:"Nyanyi", bio:"Sweet name. Serious game." },
    { name:"bokir abis", id:"SNX-BKR", role:"EXPLANER", online:true, makes:"Bubur Ayam", mikes:"Susu", muskes:"Jazz", norkes:"Podcast", herkes:"Chou", hobi:"Nongkrong", bio:"No noise. Just action." },
    { name:"Monarch x TNX", id:"SNX-COACH", role:"HEAD COACH", online:true, makes:"Steak", mikes:"Espresso", muskes:"Classical", norkes:"Documentary", herkes:"All Hero", hobi:"Analisis", bio:"Building the squad. Leading the vision." }
];

let rosterData = JSON.parse(localStorage.getItem("TEAM_SNEXTY_AURA_ROSTER")) || defaultRoster;
let currentEditIndex = 0;

const rosterGrid = document.getElementById("rosterGrid");
const editorModal = document.getElementById("editorModal");
const modalHeading = document.getElementById("modalHeading");
const modalPreviewImg = document.getElementById("modalPreviewImg");
const modalPreviewName = document.getElementById("modalPreviewName");
const fileUpload = document.getElementById("fileUpload");

const inputName = document.getElementById("inputName");
const inputID = document.getElementById("inputID");
const inputRole = document.getElementById("inputRole");
const inputOnline = document.getElementById("inputOnline");
const inputMakes = document.getElementById("inputMakes");
const inputMikes = document.getElementById("inputMikes");
const inputMuskes = document.getElementById("inputMuskes");
const inputNorkes = document.getElementById("inputNorkes");
const inputHerkes = document.getElementById("inputHerkes");
const inputHobi = document.getElementById("inputHobi");
const inputBio = document.getElementById("inputBio");
const statusTextDisplay = document.getElementById("statusTextDisplay");

function sanitizeHTML(str){
    return String(str ?? "").replace(/[&<>"']/g, function(m){
        return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#039;' }[m];
    });
}

function getRoleClass(roleStr){
    const r = (roleStr || "").toUpperCase();
    if(r.includes("GOLD")) return "role-goldlaner";
    if(r.includes("MID")) return "role-midlaner";
    if(r.includes("JUNGLE")) return "role-jungler";
    if(r.includes("SUB")) return "role-subroam"; // Sub-Roam beda aura dari roamer biasa!
    if(r.includes("ROAM")) return "role-roamer";
    if(r.includes("EXP")) return "role-explaner";
    if(r.includes("COACH") || r.includes("HEAD")) return "role-coach";
    return "role-goldlaner";
}

function generateSvgAvatar(name){
    const clean = name.replace(/[^a-zA-Z0-9]/g, "").substring(0, 2).toUpperCase() || "SN";
    return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><rect width="100%" height="100%" fill="#070d14"/><text x="50%" y="54%" text-anchor="middle" dominant-baseline="middle" fill="#35d9ff" font-size="64" font-family="sans-serif" font-weight="900">${clean}</text></svg>`)}`;
}

function renderRoster(){
    rosterGrid.innerHTML = "";
    rosterData.forEach((agent, idx) => {
        const card = document.createElement("div");
        const roleClassName = getRoleClass(agent.role);
        card.className = `agent-card ${roleClassName}`;
        card.onclick = () => openEditor(idx);

        const avatarSrc = agent.photo || generateSvgAvatar(agent.name);

        card.innerHTML = `
            <div class="card-banner">
                <div class="agent-role">${sanitizeHTML(agent.role)}</div>
                <div class="agent-avatar-wrap">
                    <img src="${avatarSrc}" alt="${sanitizeHTML(agent.name)}">
                </div>
            </div>
            <div class="card-body">
                <div class="agent-name">${sanitizeHTML(agent.name)}</div>
                <div class="agent-id">${sanitizeHTML(agent.id)}</div>
                
                <div class="bio-grid-preview">
                    <div class="bio-item"><strong>Hero:</strong> ${sanitizeHTML(agent.herkes || '-')}</div>
                    <div class="bio-item"><strong>Hobi:</strong> ${sanitizeHTML(agent.hobi || '-')}</div>
                    <div class="bio-item"><strong>Makan:</strong> ${sanitizeHTML(agent.makes || '-')}</div>
                    <div class="bio-item"><strong>Minum:</strong> ${sanitizeHTML(agent.mikes || '-')}</div>
                </div>

                <div class="agent-bio">${sanitizeHTML(agent.bio || "Belum ada bio.")}</div>

                <div class="card-footer">
                    <div class="status-indicator">
                        <span class="dot ${agent.online ? '' : 'offline'}"></span>
                        ${agent.online ? 'ONLINE' : 'OFFLINE'}
                    </div>
                    <div class="edit-hint">EDIT ↗</div>
                </div>
            </div>
        `;
        rosterGrid.appendChild(card);
    });
}

function openEditor(idx){
    currentEditIndex = idx;
    const agent = rosterData[idx];

    modalHeading.textContent = "EDIT BIODATA • " + agent.name;
    inputName.value = agent.name || "";
    inputID.value = agent.id || "";
    inputRole.value = agent.role || "";
    inputOnline.checked = !!agent.online;
    inputMakes.value = agent.makes || "";
    inputMikes.value = agent.mikes || "";
    inputMuskes.value = agent.muskes || "";
    inputNorkes.value = agent.norkes || "";
    inputHerkes.value = agent.herkes || "";
    inputHobi.value = agent.hobi || "";
    inputBio.value = agent.bio || "";

    updateStatusLabel();
    modalPreviewName.textContent = agent.name;
    modalPreviewImg.src = agent.photo || generateSvgAvatar(agent.name);
    fileUpload.value = "";
    editorModal.classList.add("active");
}

function closeEditor(){
    editorModal.classList.remove("active");
}

function updateStatusLabel(){
    statusTextDisplay.textContent = inputOnline.checked ? "ONLINE" : "OFFLINE";
}

inputOnline.addEventListener("change", updateStatusLabel);

inputName.addEventListener("input", () => {
    modalPreviewName.textContent = inputName.value || "Agent";
});

fileUpload.addEventListener("change", (e) => {
    const file = e.target.files[0];
    if(!file) return;
    if(!file.type.startsWith("image/")){
        alert("File harus format gambar.");
        fileUpload.value = "";
        return;
    }
    if(file.size > 4 * 1024 * 1024){
        alert("Maksimal ukuran file 4MB.");
        fileUpload.value = "";
        return;
    }
    const reader = new FileReader();
    reader.onload = function(evt){
        modalPreviewImg.src = evt.target.result;
    };
    reader.readAsDataURL(file);
});

function clearAvatarPhoto(){
    rosterData[currentEditIndex].photo = "";
    modalPreviewImg.src = generateSvgAvatar(inputName.value);
    fileUpload.value = "";
}

function commitChanges(){
    const agent = rosterData[currentEditIndex];
    const newName = inputName.value.trim();
    const newID = inputID.value.trim();

    if(!newName){
        alert("Nickname tidak boleh kosong.");
        return;
    }
    if(!newID){
        alert("ID tidak boleh kosong.");
        return;
    }

    agent.name = newName;
    agent.id = newID;
    agent.role = inputRole.value.trim() || "MEMBER";
    agent.online = inputOnline.checked;
    agent.makes = inputMakes.value.trim();
    agent.mikes = inputMikes.value.trim();
    agent.muskes = inputMuskes.value.trim();
    agent.norkes = inputNorkes.value.trim();
    agent.herkes = inputHerkes.value.trim();
    agent.hobi = inputHobi.value.trim();
    agent.bio = inputBio.value.trim();

    const file = fileUpload.files[0];
    if(file){
        const reader = new FileReader();
        reader.onload = function(evt){
            agent.photo = evt.target.result;
            persistAndClose();
        };
        reader.readAsDataURL(file);
    } else {
        persistAndClose();
    }
}

function persistAndClose(){
    localStorage.setItem("TEAM_SNEXTY_AURA_ROSTER", JSON.stringify(rosterData));
    renderRoster();
    closeEditor();
}

editorModal.addEventListener("click", (e) => {
    if(e.target === editorModal) closeEditor();
});

document.addEventListener("keydown", (e) => {
    if(e.key === "Escape") closeEditor();
});

renderRoster();
</script>

</body>
</html>
