<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROSTER TEAM SNEXTY</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}

:root{
    --black:#030507;
    --cyan:#35d9ff;
    --white:#f5faff;
    --muted:#71849a;
}

body{
    min-height:100vh;
    font-family: Inter, system-ui, -apple-system, sans-serif;
    color:var(--white);
    background: radial-gradient(circle at 10% 0%, rgba(0,145,255,.12), transparent 30%), var(--black);
    overflow-x:hidden;
}

.container{
    width:min(1200px,100%);
    margin:auto;
    padding:30px 18px 70px;
}

/* HEADER BERSIH & KEREN */
.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:30px;
    padding-bottom:15px;
    border-bottom:1px solid rgba(255,255,255,0.08);
}

.brand{
    display:flex;
    align-items:center;
    gap:14px;
}

.logo{
    width:55px;height:55px;
    display:grid;place-items:center;
    border-radius:16px;
    background:linear-gradient(145deg, #0c2c43, #050a10);
    border:1px solid #1d638a;
    box-shadow:0 0 25px rgba(0,180,255,.16);
}
.logo span{font-size:17px;font-weight:1000;color:var(--cyan);text-shadow:0 0 15px rgba(53,217,255,.7);}
.brand-title{font-size:22px;font-weight:900;letter-spacing:.13em;}
.brand-subtitle{margin-top:3px;color:var(--cyan);font-size:10px;letter-spacing:.25em;}

.header-button{
    border:1px solid #214d6b;
    background:#07111a;
    color:#bfeeff;
    padding:11px 18px;
    border-radius:11px;
    cursor:pointer;
    font-weight:800;
    transition:.2s;
}
.header-button:hover{border-color:var(--cyan);color:white;box-shadow:0 0 22px rgba(0,180,255,.2);}

.member-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(295px,1fr));
    gap:28px;
}

/* =====================================================
   KARTU MEMBER DENGAN BORDER FISIK TEGAS
===================================================== */
.member-card{
    position:relative;
    min-height:450px;
    overflow:visible;
    border-radius:23px;
    border:2.5px solid var(--card-border-color, #24425e);
    background: var(--card-bg-color, linear-gradient(150deg, #0b121b, #04070b));
    box-shadow: 
        0 20px 50px rgba(0,0,0,.7),
        inset 0 0 20px rgba(255,255,255,0.02),
        0 0 30px var(--card-aura-color, rgba(0,140,255,0.15));
    cursor:pointer;
    transition:.25s ease;
    margin-top: 15px;
}
.member-card:hover{
    transform:translateY(-6px);
    box-shadow: 
        0 28px 65px rgba(0,0,0,.8),
        0 0 45px var(--card-aura-color, rgba(0,180,255,0.35));
}

.card-cover{
    height:130px;
    position:relative;
    overflow:hidden;
    background: var(--cover-bg-color, linear-gradient(135deg, #0b293d, #050a10));
    border-top-left-radius: 20px;
    border-top-right-radius: 20px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
}

.role-badge{
    position:absolute;
    z-index:5;
    right:13px;
    top:13px;
    padding:7px 11px;
    border-radius:8px;
    background:rgba(3,10,17,.94);
    border:1px solid rgba(50,150,255,0.4);
    color:var(--cyan);
    font-size:9px;
    font-weight:900;
    letter-spacing:.12em;
}

/* =====================================================
   AVATAR & BORDER ALA MLBB (MENONJOL KELUAR / ORNAMEN)
===================================================== */
.avatar-wrapper{
    position:absolute;
    z-index:10;
    left:18px;
    bottom:-48px;
    width:112px;
    height:112px;
}

.avatar-img{
    position:absolute;
    inset:16px;
    width:calc(100% - 32px);
    height:calc(100% - 32px);
    object-fit:cover;
    border-radius:50%;
    background:#0b1621;
}

/* SVG Border ukurannya lebih besar supaya ornamen sayap/api/mahkota keluar dari kotak avatar */
.avatar-border-overlay{
    position:absolute;
    top:-12px;
    left:-12px;
    width:136px;
    height:136px;
    pointer-events:none;
    filter: drop-shadow(0 0 10px rgba(0,220,255,0.6));
}

.card-content{
    padding:65px 18px 18px;
}

.member-name{
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
    font-size:20px;
    font-weight:900;
}

.member-id{
    margin-top:3px;
    color:#63819b;
    font-family:monospace;
    font-size:11px;
}

.bio-grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:6px 10px;
    margin-top:12px;
    padding:10px;
    background:rgba(0,0,0,0.45);
    border-radius:12px;
    border:1px solid rgba(255,255,255,0.06);
}

.bio-item{
    font-size:11px;
    color:#9fb3c8;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}
.bio-item span{color:var(--cyan);font-weight:700;}

.member-bio{
    margin-top:10px;
    color:#8ea2b7;
    font-size:11px;
    line-height:1.4;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
}

.card-footer{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:14px;
    padding-top:12px;
    border-top:1px solid rgba(255,255,255,0.08);
}

.status{
    display:flex;
    align-items:center;
    gap:8px;
    color:#a8b8ca;
    font-size:11px;
}
.status-dot{width:8px;height:8px;border-radius:50%;background:#38e89a;box-shadow:0 0 10px rgba(56,232,154,.8);}
.status-dot.offline{background:#526071;box-shadow:none;}
.edit-label{color:var(--cyan);font-size:10px;font-weight:900;letter-spacing:.12em;}

/* =====================================================
   MODAL EDITOR
===================================================== */
.modal{
    position:fixed;
    inset:0;
    z-index:1000;
    display:none;
    align-items:center;
    justify-content:center;
    padding:16px;
    background:rgba(0,3,7,.9);
    backdrop-filter:blur(15px);
}
.modal.active{display:flex;}

.modal-box{
    width:min(660px,100%);
    max-height:92vh;
    overflow-y:auto;
    padding:22px;
    border-radius:25px;
    border:1px solid #21425a;
    background:linear-gradient(145deg, #0b131d, #04070b);
    box-shadow:0 30px 100px rgba(0,0,0,.9);
}

.modal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
}
.modal-title{font-size:19px;font-weight:900;}
.close{width:39px;height:39px;border:0;border-radius:10px;background:#101a24;color:#c6d6e6;font-size:21px;cursor:pointer;}

.customizer-preview-area{
    display:flex;
    align-items:center;
    gap:18px;
    padding:16px;
    margin-bottom:18px;
    border-radius:18px;
    border:1px solid #1b3041;
    background:#070d14;
}

.preview-avatar-container{
    position:relative;
    width:95px;
    height:95px;
    flex-shrink:0;
    overflow:visible;
}
.preview-photo{
    position:absolute;
    inset:14px;
    width:67px;
    height:67px;
    object-fit:cover;
    border-radius:50%;
    background:#0b1621;
}
.preview-border-overlay{
    position:absolute;
    top:-10px;left:-10px;
    width:115px;height:115px;
    pointer-events:none;
}

.preview-info h4{font-size:16px;font-weight:900;}
.preview-info p{color:#6d8095;font-size:10px;margin-top:3px;}

.photo-actions{display:flex;gap:8px;margin-top:8px;}
.small-button{
    padding:8px 12px;
    border-radius:8px;
    border:1px solid #24475f;
    background:#0b1621;
    color:#c8edff;
    font-size:10px;
    font-weight:800;
    cursor:pointer;
}

.form{display:grid;gap:12px;}
.form-group label{display:block;color:#8194a9;font-size:10px;font-weight:900;letter-spacing:.12em;margin-bottom:5px;}

input, select, textarea{
    width:100%;
    padding:11px;
    outline:none;
    border-radius:10px;
    border:1px solid #1d3243;
    background:#04090e;
    color:white;
    font-family:inherit;
    font-size:12px;
}
input:focus, select:focus, textarea:focus{border-color:var(--cyan);box-shadow:0 0 15px rgba(0,180,255,.15);}
textarea{min-height:70px;resize:vertical;}

.two-column{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.three-column{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}

.section-divider{
    font-size:11px;
    font-weight:900;
    color:var(--cyan);
    letter-spacing:.15em;
    margin-top:10px;
    border-bottom:1px solid #172d42;
    padding-bottom:4px;
}

.status-control{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:11px;
    border-radius:10px;
    border:1px solid #1d3243;
    background:#04090e;
}
.status-control span{color:#c7d6e4;font-size:12px;font-weight:800;}
.status-control input{width:auto;margin:0;accent-color:var(--cyan);}

.save-button{
    width:100%;
    margin-top:16px;
    padding:13px;
    border:0;
    border-radius:12px;
    background:linear-gradient(135deg, #168cff, #25d8ff);
    color:white;
    font-weight:1000;
    letter-spacing:.1em;
    cursor:pointer;
    box-shadow:0 10px 30px rgba(0,150,255,.23);
}

::-webkit-scrollbar{width:7px;}
::-webkit-scrollbar-track{background:#030507;}
::-webkit-scrollbar-thumb{background:#163c56;border-radius:20px;}

@media(max-width:600px){
    .container{padding:18px 13px 55px;}
    .two-column, .three-column{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<div class="container">
    <header class="header">
        <div class="brand">
            <div class="logo"><span>SNX</span></div>
            <div>
                <div class="brand-title">ROSTER TEAM SNEXTY</div>
                <div class="brand-subtitle">OFFICIAL SQUAD LINEUP</div>
            </div>
        </div>
        <button class="header-button" onclick="openEditor(0)">✦ EDIT ROSTER</button>
    </header>

    <main class="member-grid" id="memberGrid"></main>
</div>

<!-- MODAL EDITOR -->
<div class="modal" id="modal">
    <div class="modal-box">
        <div class="modal-header">
            <div class="modal-title">KUSTOMISASI KARTU & BORDER</div>

            <div class="two-column">
                <div class="form-group">
                    <label>WARNA COVER ATAS</label>
                    <input id="coverBgColorInput" type="color" value="#0b293d" style="height:40px; padding:2px; cursor:pointer;">
                </div>
                <div class="form-group">
                    <label>WARNA AURA GLOW</label>
                    <input id="cardAuraInput" type="color" value="#168cff" style="height:40px; padding:2px; cursor:pointer;">
                </div>
            </div>

            <div class="section-divider">PILIHAN BORDER AVATAR ALA MLBB</div>
            <div class="two-column">
                <div class="form-group">
                    <label>TEMA BORDER</label>
                    <select id="borderThemeInput" onchange="onThemeChange()">
                        <option value="mythic">🌟 Mythic & Sayap Kristal</option>
                        <option value="sangar">🔥 Bara Api Berkobar</option>
                        <option value="akar">🌿 Sulur Akar & Alam Liar</option>

                </div>
                <div class="form-group">
                    <label>MEMBER ID</label>
                    <input id="idInput" type="text" maxlength="25" placeholder="SNX-XXXX">
                </div>
            </div>

            <div class="two-column">
                <div class="form-group">
                    <label>ROLE</label>
                    <input id="roleInput" type="text" maxlength="25" placeholder="Jungler / Gold Laner">
                </div>
                <div class="form-group">
                    <label>STATUS</label>
                    <div class="status-control">
                        <span id="statusLabel">ONLINE</span>
                        <input id="onlineInput" type="checkbox">
                    </div>
                </div>
            </div>

            <div class="section-divider">BIODATA LENGKAP</div>
            <div class="three-column">
                <div class="form-group"><label>MAKES</label><input id="makesInput" type="text" placeholder="Hero Favorit"></div>

            <div class="form-group">
                <label>BIO / QUOTE</label>
                <textarea id="bioInput" maxlength="150" placeholder="Tulis bio kamu..."></textarea>
            </div>
        </div>

        <button class="save-button" onclick="saveProfile()">SIMPAN PERUBAHAN</button>
    </div>
</div>

let editingIndex = 0;

const grid = document.getElementById("memberGrid");
const modal = document.getElementById("modal");
const nameInput = document.getElementById("nameInput");
const idInput = document.getElementById("idInput");
const roleInput = document.getElementById("roleInput");
const bioInput = document.getElementById("bioInput");
const onlineInput = document.getElementById("onlineInput");
const photoInput = document.getElementById("photoInput");
const previewPhoto = document.getElementById("previewPhoto");
const previewName = document.getElementById("previewName");
const previewBorderOverlay = document.getElementById("previewBorderOverlay");
const statusLabel = document.getElementById("statusLabel");

const cardBgColorInput = document.getElementById("cardBgColorInput");
const coverBgColorInput = document.getElementById("coverBgColorInput");
const cardBorderColorInput = document.getElementById("cardBorderColorInput");
const cardAuraInput = document.getElementById("cardAuraInput");
const borderThemeInput = document.getElementById("borderThemeInput");
const borderStyleInput = document.getElementById("borderStyleInput");

const makesInput = document.getElementById("makesInput");
const mikesInput = document.getElementById("mikesInput");
const igInput = document.getElementById("igInput");
const hobiInput = document.getElementById("hobiInput");
const norkesInput = document.getElementById("norkesInput");
const muskesInput = document.getElementById("muskesInput");

function escapeHTML(text){
    return String(text ?? "").replace(/[&<>"']/g, function(char){
        return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;" }[char];
    });
}

function getInitials(name){
    return (name.replace(/[^a-zA-Z0-9]/g, "").substring(0,2).toUpperCase() || "SN");
}

function defaultAvatar(name){
    return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300"><rect width="100%" height="100%" fill="#0b1621"/><text x="50%" y="55%" text-anchor="middle" dominant-baseline="middle" fill="#35d9ff" font-size="80" font-family="Arial" font-weight="900">${getInitials(name)}</text></svg>`)}`;
}

function getSvgString(theme, styleId){
    const list = borderStyles[theme] || borderStyles.mythic;
    const found = list.find(item => item.id == styleId) || list[0];
    return found.svg;
}

function onThemeChange(){
    const theme = borderThemeInput.value;
    const styles = borderStyles[theme] || borderStyles.mythic;
    borderStyleInput.innerHTML = "";
    styles.forEach(st => {
        const opt = document.createElement("option");
        opt.value = st.id;
        opt.textContent = st.name;
        borderStyleInput.appendChild(opt);
    });
    updatePreviewVisuals();
}

borderStyleInput.addEventListener("change", updatePreviewVisuals);
cardAuraInput.addEventListener("input", updatePreviewVisuals);

function updatePreviewVisuals(){
    previewBorderOverlay.innerHTML = getSvgString(borderThemeInput.value, borderStyleInput.value);
    previewName.textContent = nameInput.value || "Member";
}

function renderMembers(){
    grid.innerHTML = "";
    members.forEach((member, index) => {
        const card = document.createElement("article");
        card.className = "member-card";
        card.style.setProperty("--card-bg-color", member.cardBg || "linear-gradient(150deg, #0b121b, #04070b)");
        card.style.setProperty("--cover-bg-color", member.coverBg || "linear-gradient(135deg, #0b293d, #050a10)");
        card.style.setProperty("--card-border-color", member.cardBorder || "#24425e");
        card.style.setProperty("--card-aura-color", member.auraColor || "rgba(0,140,255,0.15)");
        
        card.onclick = () => openEditor(index);

        const photo = member.photo || defaultAvatar(member.name);
        const svgBorder = getSvgString(member.theme || "mythic", member.styleId || 1);

        card.innerHTML = `
            <div class="card-cover">
                <div class="role-badge">${escapeHTML(member.role)}</div>
                <div class="avatar-wrapper">
                    <img class="avatar-img" src="${photo}" alt="${escapeHTML(member.name)}">
                    <div class="avatar-border-overlay">${svgBorder}</div>
                </div>
            </div>
            <div class="card-content">
                <div class="member-name">${escapeHTML(member.name)}</div>
                <div class="member-id">${escapeHTML(member.id)}</div>
                
                <div class="bio-grid">
                    <div class="bio-item">Makes: <span>${escapeHTML(member.makes || '-')}</span></div>
                    <div class="bio-item">Mikes: <span>${escapeHTML(member.mikes || '-')}</span></div>
                    <div class="bio-item">IG: <span>${escapeHTML(member.ig || '-')}</span></div>
                    <div class="bio-item">Hobi: <span>${escapeHTML(member.hobi || '-')}</span></div>
                    <div class="bio-item">Norkes: <span>${escapeHTML(member.norkes || '-')}</span></div>
                    <div class="bio-item">Muskes: <span>${escapeHTML(member.muskes || '-')}</span></div>
                </div>

                <div class="member-bio">${escapeHTML(member.bio || "Belum ada bio.")}</div>
                
                <div class="card-footer">
                    <div class="status">
                        <span class="status-dot ${member.online ? "" : "offline"}"></span>
                        ${member.online ? "ONLINE" : "OFFLINE"}
                    </div>
                    <div class="edit-label">EDIT ↗</div>
                </div>
            </div>
        `;
        grid.appendChild(card);
    });
}

function openEditor(index){
    editingIndex = index;
    const member = members[index];

    document.querySelector(".modal-title").textContent = "EDIT • " + member.name;

    nameInput.value = member.name;
    idInput.value = member.id;
    roleInput.value = member.role;
    bioInput.value = member.bio;
    onlineInput.checked = member.online;

    makesInput.value = member.makes || "";
    mikesInput.value = member.mikes || "";
    igInput.value = member.ig || "";
    hobiInput.value = member.hobi || "";
    norkesInput.value = member.norkes || "";
    muskesInput.value = member.muskes || "";

    cardBgColorInput.value = member.cardBgHex || "#0b121b";
    coverBgColorInput.value = member.coverBgHex || "#0b293d";
    cardBorderColorInput.value = member.cardBorder || "#24425e";
    cardAuraInput.value = member.auraColor || "#168cff";

    borderThemeInput.value = member.theme || "mythic";
    onThemeChange();
    borderStyleInput.value = member.styleId || 1;

    updateStatusText();
    previewName.textContent = member.name;
    previewPhoto.src = member.photo || defaultAvatar(member.name);
    photoInput.value = "";
    updatePreviewVisuals();

    modal.classList.add("active");
}

function closeEditor(){ modal.classList.remove("active"); }
function updateStatusText(){ statusLabel.textContent = onlineInput.checked ? "ONLINE" : "OFFLINE"; }
onlineInput.addEventListener("change", updateStatusText);
nameInput.addEventListener("input", updatePreviewVisuals);

photoInput.addEventListener("change", (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => { previewPhoto.src = ev.target.result; };
    reader.readAsDataURL(file);
});

function removePhoto(){
    members[editingIndex].photo = "";
    previewPhoto.src = defaultAvatar(nameInput.value);
    photoInput.value = "";
}

function saveProfile(){
    const member = members[editingIndex];
    if(!nameInput.value.trim()){ alert("Nama wajib diisi."); return; }
    if(!idInput.value.trim()){ alert("ID wajib diisi."); return; }

    member.name = nameInput.value.trim();
    member.id = idInput.value.trim();
    member.role = roleInput.value.trim() || "MEMBER";
    member.bio = bioInput.value.trim();
    member.online = onlineInput.checked;

    member.makes = makesInput.value.trim();
    member.mikes = mikesInput.value.trim();
    member.ig = igInput.value.trim();
    member.hobi = hobiInput.value.trim();
    member.norkes = norkesInput.value.trim();
    member.muskes = muskesInput.value.trim();

    member.cardBgHex = cardBgColorInput.value;
    member.cardBg = `linear-gradient(150deg, ${cardBgColorInput.value}, #04070b)`;
    member.coverBgHex = coverBgColorInput.value;
    member.coverBg = `linear-gradient(135deg, ${coverBgColorInput.value}, #050a10)`;
    member.cardBorder = cardBorderColorInput.value;
    member.auraColor = cardAuraInput.value;

    member.theme = borderThemeInput.value;
    member.styleId = parseInt(borderStyleInput.value);

    const file = photoInput.files[0];
    if(file){
        const reader = new FileReader();
        reader.onload = (ev) => {
            member.photo = ev.target.result;
            finishSave();
        };
        reader.readAsDataURL(file);
    } else {
        finishSave();
    }
}

function finishSave(){
    localStorage.setItem("SNEXTY_ROSTER_ULTIMATE", JSON.stringify(members));
    renderMembers();
    closeEditor();
}

modal.addEventListener("click", (e) => { if(e.target === modal) closeEditor(); });
document.addEventListener("keydown", (e) => { if(e.key === "Escape") closeEditor(); });

renderMembers();
</script>

</body>
</html>
