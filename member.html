<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEAM SNEXTY — Command Roster</title>
<style>
/* =====================================================
   TEAM SNEXTY - COMMAND CENTER ROSTER (REDESIGNED)
   THEME: Deep Black, Electric Blue, Cyan Neon
===================================================== */
:root {
    --bg-base: #030507;
    --bg-surface: #070d14;
    --bg-card: #09121c;
    --border-color: #15293d;
    --border-glow: #21517a;
    
    --primary: #168cff;
    --cyan: #35d9ff;
    --cyan-glow: rgba(53, 217, 255, 0.25);
    
    --text-main: #f0f6fc;
    --text-muted: #8397ad;
    
    --green: #2ecc71;
    --offline-gray: #4a596a;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background-color: var(--bg-base);
    color: var(--text-main);
    background-image: 
        radial-gradient(circle at 15% 10%, rgba(22, 140, 255, 0.12), transparent 35%),
        radial-gradient(circle at 85% 90%, rgba(53, 217, 255, 0.08), transparent 40%);
    background-attachment: fixed;
    overflow-x: hidden;
}

/* Background Cyber Grid Lines */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image: 
        linear-gradient(to right, rgba(21, 41, 61, 0.15) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(21, 41, 61, 0.15) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: -1;
}

.wrapper {
    max-width: 1280px;
    margin: 0 auto;
    padding: 30px 20px 60px;
}

/* TOP COMMAND BAR */
.command-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(7, 13, 20, 0.85);
    border: 1px solid var(--border-color);
    backdrop-filter: blur(12px);
    padding: 16px 24px;
    border-radius: 16px;
    margin-bottom: 35px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
}

.brand-group {
    display: flex;
    align-items: center;
    gap: 15px;
}

.brand-icon {
    width: 48px;
    height: 48px;
    background: linear-gradient(135deg, #0b1e30, #04090f);
    border: 1px solid var(--border-glow);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    color: var(--cyan);
    font-size: 15px;
    box-shadow: 0 0 15px var(--cyan-glow);
}

.brand-text h2 {
    font-size: 18px;
    letter-spacing: 1.5px;
    font-weight: 800;
}

.brand-text p {
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 2px;
}

.nav-actions {
    display: flex;
    gap: 12px;
}

.cyber-btn {
    background: #091522;
    border: 1px solid var(--border-glow);
    color: var(--cyan);
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: all 0.25s ease;
}

.cyber-btn:hover {
    background: var(--primary);
    color: #fff;
    border-color: var(--cyan);
    box-shadow: 0 0 20px var(--cyan-glow);
    transform: translateY(-2px);
}

/* SECTION HEADER BANNER */
.roster-header {
    text-align: center;
    margin-bottom: 40px;
}

.roster-header span {
    color: var(--cyan);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 4px;
    text-transform: uppercase;
    background: rgba(53, 217, 255, 0.08);
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid rgba(53, 217, 255, 0.2);
}

.roster-header h1 {
    font-size: clamp(28px, 5vw, 42px);
    font-weight: 900;
    margin-top: 15px;
    letter-spacing: -0.5px;
    background: linear-gradient(180deg, #fff, #91b5d6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.roster-header p {
    color: var(--text-muted);
    font-size: 14px;
    max-width: 550px;
    margin: 10px auto 0;
    line-height: 1.6;
}

/* MODERN SQUAD GRID */
.roster-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 22px;
}

/* AGENT CARD */
.agent-card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 20px;
    overflow: hidden;
    position: relative;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
}

.agent-card:hover {
    transform: translateY(-8px);
    border-color: var(--cyan);
    box-shadow: 0 20px 45px rgba(0, 0, 0, 0.7), 0 0 25px var(--cyan-glow);
}

.card-banner {
    height: 110px;
    background: linear-gradient(135deg, #0d233a, #050a12);
    position: relative;
    display: flex;
    justify-content: flex-end;
    padding: 12px;
}

.agent-role {
    background: rgba(3, 5, 7, 0.85);
    border: 1px solid var(--border-glow);
    color: var(--cyan);
    font-size: 10px;
    font-weight: 800;
    padding: 5px 10px;
    border-radius: 6px;
    letter-spacing: 1px;
    height: fit-content;
}

.agent-avatar-wrap {
    position: absolute;
    left: 20px;
    bottom: -32px;
    width: 80px;
    height: 80px;
    border-radius: 16px;
    border: 3px solid var(--bg-card);
    background: var(--bg-surface);
    overflow: hidden;
    box-shadow: 0 8px 20px rgba(0,0,0,0.6);
}

.agent-avatar-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.card-body {
    padding: 45px 20px 20px;
}

.agent-name {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: -0.3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.agent-id {
    font-family: monospace;
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 3px;
}

.agent-bio {
    font-size: 12px;
    color: #a1b5cb;
    margin-top: 12px;
    line-height: 1.5;
    min-height: 36px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 18px;
    padding-top: 12px;
    border-top: 1px solid var(--border-color);
}

.status-indicator {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
}

.dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 10px var(--green);
}

.dot.offline {
    background: var(--offline-gray);
    box-shadow: none;
}

.edit-hint {
    font-size: 10px;
    font-weight: 800;
    color: var(--cyan);
    letter-spacing: 1px;
}

/* CUSTOM MODAL OVERLAY */
.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(2, 4, 7, 0.82);
    backdrop-filter: blur(10px);
    z-index: 1000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.modal-overlay.active {
    display: flex;
}

.modal-container {
    width: 100%;
    max-width: 520px;
    background: var(--bg-surface);
    border: 1px solid var(--border-glow);
    border-radius: 24px;
    padding: 25px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.8), 0 0 30px var(--cyan-glow);
    animation: modalPop 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes modalPop {
    0% { opacity: 0; transform: scale(0.95) translateY(10px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 22px;
}

.modal-title {
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 0.5px;
}

.modal-close {
    background: #0d1a26;
    border: 1px solid var(--border-color);
    color: var(--text-main);
    width: 36px;
    height: 36px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.2s;
}

.modal-close:hover {
    background: #e74c3c;
    border-color: #e74c3c;
}

.preview-box {
    display: flex;
    align-items: center;
    gap: 16px;
    background: #04090f;
    border: 1px solid var(--border-color);
    padding: 14px;
    border-radius: 16px;
    margin-bottom: 20px;
}

.preview-img {
    width: 65px;
    height: 65px;
    border-radius: 14px;
    object-fit: cover;
    border: 2px solid var(--border-glow);
}

.preview-info h4 {
    font-size: 15px;
    font-weight: 800;
}

.preview-info p {
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 1px;
    margin-top: 4px;
}

.btn-row {
    display: flex;
    gap: 8px;
    margin-top: 8px;
}

.mini-btn {
    background: #091522;
    border: 1px solid var(--border-glow);
    color: var(--cyan);
    font-size: 10px;
    font-weight: 700;
    padding: 6px 10px;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.2s;
}

.mini-btn:hover {
    background: var(--primary);
    color: #fff;
}

.form-field {
    margin-bottom: 14px;
}

.form-field label {
    display: block;
    font-size: 10px;
    font-weight: 800;
    color: var(--text-muted);
    letter-spacing: 1.5px;
    margin-bottom: 6px;
}

.form-field input, 
.form-field textarea {
    width: 100%;
    background: #04090f;
    border: 1px solid var(--border-color);
    border-radius: 10px;
    padding: 11px 14px;
    color: var(--text-main);
    font-family: inherit;
    font-size: 13px;
    outline: none;
    transition: 0.2s;
}

.form-field input:focus, 
.form-field textarea:focus {
    border-color: var(--cyan);
    box-shadow: 0 0 12px var(--cyan-glow);
}

.form-field textarea {
    resize: vertical;
    min-height: 80px;
}

.grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.status-switch-box {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #04090f;
    border: 1px solid var(--border-color);
    padding: 10px 14px;
    border-radius: 10px;
}

.status-switch-box span {
    font-size: 12px;
    font-weight: 700;
}

.status-switch-box input {
    width: auto;
    accent-color: var(--cyan);
    cursor: pointer;
}

.save-action-btn {
    width: 100%;
    background: linear-gradient(135deg, var(--primary), var(--cyan));
    color: #fff;
    border: none;
    padding: 13px;
    border-radius: 12px;
    font-weight: 900;
    letter-spacing: 1.5px;
    font-size: 12px;
    cursor: pointer;
    margin-top: 10px;
    box-shadow: 0 8px 25px rgba(22, 140, 255, 0.3);
    transition: 0.2s;
}

.save-action-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 30px rgba(53, 217, 255, 0.4);
}

/* RESPONSIVE */
@media (max-width: 600px) {
    .wrapper {
        padding: 15px 12px 40px;
    }
    .command-bar {
        padding: 12px 16px;
    }
    .grid-2 {
        grid-template-columns: 1fr;
    }
}
</style>
</head>
<body>

<div class="wrapper">
    <!-- COMMAND BAR -->
    <header class="command-bar">
        <div class="brand-group">
            <div class="brand-icon">SNX</div>
            <div class="brand-text">
                <h2>TEAM SNEXTY</h2>
                <p>Command Center</p>
            </div>
        </div>
        <div class="nav-actions">
            <a href="home (1).html" class="cyber-btn">⌂ HOME</a>
            <button class="cyber-btn" onclick="openEditor(0)">✦ CUSTOMIZE</button>
        </div>
    </header>

    <!-- SECTION TITLE -->
    <div class="roster-header">
        <span>ACTIVE SQUAD REGISTRY</span>
        <h1>TACTICAL ROSTER</h1>
        <p>Database profil elit Team Snexty. Ketuk kartu agen manapun di bawah untuk mengubah identitas, role, foto, dan status secara real-time.</p>
    </div>

    <!-- ROSTER GRID -->
    <main class="roster-grid" id="rosterGrid"></main>
</div>

<!-- EDITOR MODAL -->
<div class="modal-overlay" id="editorModal">
    <div class="modal-container">
        <div class="modal-header">
            <div class="modal-title" id="modalHeading">EDIT AGENT PROFILE</div>
            <button class="modal-close" onclick="closeEditor()">×</button>
        </div>

        <div class="preview-box">
            <img id="modalPreviewImg" class="preview-img" alt="Avatar Preview">
            <div class="preview-info">
                <h4 id="modalPreviewName">Agent Name</h4>
                <p>AVATAR SOURCE</p>
                <div class="btn-row">
                    <button class="mini-btn" onclick="document.getElementById('fileUpload').click()">UPLOAD</button>
                    <button class="mini-btn" onclick="clearAvatarPhoto()">RESET</button>
                </div>
            </div>
        </div>
        <input type="file" id="fileUpload" accept="image/*" hidden>

        <div class="form-field">
            <label>AGENT NAME / NICKNAME</label>
            <input type="text" id="inputName" maxlength="30" placeholder="Masukkan nama...">
        </div>

        <div class="grid-2">
            <div class="form-field">
                <label>AGENT ID</label>
                <input type="text" id="inputID" maxlength="25" placeholder="SNX-XXXX">
            </div>
            <div class="form-field">
                <label>ROLE / POSITION</label>
                <input type="text" id="inputRole" maxlength="25" placeholder="GOLDLANER / COACH">
            </div>
        </div>

        <div class="form-field">
            <label>ONLINE STATUS</label>
            <div class="status-switch-box">
                <span id="statusTextDisplay">ONLINE</span>
                <input type="checkbox" id="inputOnline">
            </div>
        </div>

        <div class="form-field">
            <label>BIO / QUOTE</label>
            <textarea id="inputBio" maxlength="150" placeholder="Tulis bio atau catatan taktis..."></textarea>
        </div>

        <button class="save-action-btn" onclick="commitChanges()">SIMPAN PERUBAHAN</button>
    </div>
</div>

<script>
const defaultRoster = [
    { name:"NevTryz", id:"SNX-NEV", role:"GOLDLANER", online:true, bio:"Different role. One squad. One goal.", photo:"" },
    { name:"Santaeee", id:"SNX-SAN", role:"MIDLANER", online:true, bio:"Stay sharp. Stay SNEXTY.", photo:"" },
    { name:"PARADOX", id:"SNX-PDX", role:"JUNGLER", online:false, bio:"Play smart. Move different.", photo:"" },
    { name:"alfazira", id:"SNX-ALF", role:"ROAMER", online:true, bio:"Calm mind, clean play.", photo:"" },
    { name:"™•strawberry", id:"SNX-STR", role:"EXP LANER", online:false, bio:"Sweet name. Serious game.", photo:"" },
    { name:"bokir abis", id:"SNX-BKR", role:"SUB/GACOR", online:true, bio:"No noise. Just action.", photo:"" },
    { name:"Monarch x TNX", id:"SNX-COACH", role:"HEAD COACH", online:true, bio:"Building the squad. Leading the vision.", photo:"" }
];

let rosterData = JSON.parse(localStorage.getItem("TEAM_SNEXTY_COMMAND_ROSTER")) || defaultRoster;
let currentEditIndex = 0;

const rosterGrid = document.getElementById("rosterGrid");
const editorModal = document.getElementById("editorModal");
const modalHeading = document.getElementById("modalHeading");
const modalPreviewImg = document.getElementById("modalPreviewImg");
const modalPreviewName = document.getElementById("modalPreviewName");
const fileUpload = document.getElementById("fileUpload");
const inputName = document.getElementById("inputName");
const inputID = document.getElementById("inputID");
const inputRole = document.getElementById("inputRole");
const inputOnline = document.getElementById("inputOnline");
const inputBio = document.getElementById("inputBio");
const statusTextDisplay = document.getElementById("statusTextDisplay");

function sanitizeHTML(str){
    return String(str ?? "").replace(/[&<>"']/g, function(m){
        return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#039;' }[m];
    });
}

function generateSvgAvatar(name){
    const clean = name.replace(/[^a-zA-Z0-9]/g, "").substring(0, 2).toUpperCase() || "SN";
    return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><rect width="100%" height="100%" fill="#070d14"/><text x="50%" y="54%" text-anchor="middle" dominant-baseline="middle" fill="#35d9ff" font-size="64" font-family="sans-serif" font-weight="900">${clean}</text></svg>`)}`;
}

function renderRoster(){
    rosterGrid.innerHTML = "";
    rosterData.forEach((agent, idx) => {
        const card = document.createElement("div");
        card.className = "agent-card";
        card.onclick = () => openEditor(idx);

        const avatarSrc = agent.photo || generateSvgAvatar(agent.name);

        card.innerHTML = `
            <div class="card-banner">
                <div class="agent-role">${sanitizeHTML(agent.role)}</div>
                <div class="agent-avatar-wrap">
                    <img src="${avatarSrc}" alt="${sanitizeHTML(agent.name)}">
                </div>
            </div>
            <div class="card-body">
                <div class="agent-name">${sanitizeHTML(agent.name)}</div>
                <div class="agent-id">${sanitizeHTML(agent.id)}</div>
                <div class="agent-bio">${sanitizeHTML(agent.bio || "Tidak ada catatan bio.")}</div>
                <div class="card-footer">
                    <div class="status-indicator">
                        <span class="dot ${agent.online ? '' : 'offline'}"></span>
                        ${agent.online ? 'ONLINE' : 'OFFLINE'}
                    </div>
                    <div class="edit-hint">EDIT ↗</div>
                </div>
            </div>
        `;
        rosterGrid.appendChild(card);
    });
}

function openEditor(idx){
    currentEditIndex = idx;
    const agent = rosterData[idx];

    modalHeading.textContent = "EDIT • " + agent.name;
    inputName.value = agent.name;
    inputID.value = agent.id;
    inputRole.value = agent.role;
    inputOnline.checked = agent.online;
    inputBio.value = agent.bio;

    updateStatusLabel();
    modalPreviewName.textContent = agent.name;
    modalPreviewImg.src = agent.photo || generateSvgAvatar(agent.name);
    fileUpload.value = "";
    editorModal.classList.add("active");
}

function closeEditor(){
    editorModal.classList.remove("active");
}

function updateStatusLabel(){
    statusTextDisplay.textContent = inputOnline.checked ? "ONLINE" : "OFFLINE";
}

inputOnline.addEventListener("change", updateStatusLabel);

inputName.addEventListener("input", () => {
    modalPreviewName.textContent = inputName.value || "Agent";
});

fileUpload.addEventListener("change", (e) => {
    const file = e.target.files[0];
    if(!file) return;
    if(!file.type.startsWith("image/")){
        alert("File harus berupa format gambar.");
        fileUpload.value = "";
        return;
    }
    if(file.size > 4 * 1024 * 1024){
        alert("Ukuran maksimum file adalah 4MB.");
        fileUpload.value = "";
        return;
    }
    const reader = new FileReader();
    reader.onload = function(evt){
        modalPreviewImg.src = evt.target.result;
    };
    reader.readAsDataURL(file);
});

function clearAvatarPhoto(){
    rosterData[currentEditIndex].photo = "";
    modalPreviewImg.src = generateSvgAvatar(inputName.value);
    fileUpload.value = "";
}

function commitChanges(){
    const agent = rosterData[currentEditIndex];
    const newName = inputName.value.trim();
    const newID = inputID.value.trim();

    if(!newName){
        alert("Nama agen tidak boleh kosong.");
        return;
    }
    if(!newID){
        alert("ID agen tidak boleh kosong.");
        return;
    }

    agent.name = newName;
    agent.id = newID;
    agent.role = inputRole.value.trim() || "AGENT";
    agent.bio = inputBio.value.trim();
    agent.online = inputOnline.checked;

    const file = fileUpload.files[0];
    if(file){
        const reader = new FileReader();
        reader.onload = function(evt){
            agent.photo = evt.target.result;
            persistAndClose();
        };
        reader.readAsDataURL(file);
    } else {
        persistAndClose();
    }
}

function persistAndClose(){
    localStorage.setItem("TEAM_SNEXTY_COMMAND_ROSTER", JSON.stringify(rosterData));
    renderRoster();
    closeEditor();
}

editorModal.addEventListener("click", (e) => {
    if(e.target === editorModal) closeEditor();
});

document.addEventListener("keydown", (e) => {
    if(e.key === "Escape") closeEditor();
});

renderRoster();
</script>

</body>
</html>
