<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TNEX - MLBB Pro Strategy Board</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #030712;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 25px;
            background: rgba(3, 7, 18, 0.9);
            border-bottom: 1px solid #1e293b;
        }

        .back-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
        }

        .room-title {
            font-size: 15px;
            font-weight: 600;
        }

        /* Container Utama */
        .strategy-container {
            display: flex;
            flex: 1;
            padding: 15px;
            gap: 15px;
            height: calc(100vh - 55px);
        }

        /* Sidebar Kontrol */
        .sidebar {
            width: 320px;
            background: rgba(11, 25, 44, 0.95);
            border: 1px solid #0284c7;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 0 20px rgba(2, 132, 199, 0.2);
            overflow-y: auto;
        }

        .section-title {
            font-size: 12px;
            color: #38bdf8;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .phase-tabs {
            display: flex;
            gap: 5px;
        }

        .phase-tab {
            flex: 1;
            background: #030712;
            border: 1px solid #1e293b;
            color: #94a3b8;
            padding: 6px;
            font-size: 11px;
            text-align: center;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }

        .phase-tab.active {
            background: #0284c7;
            color: #fff;
            border-color: #38bdf8;
        }

        /* Palet Bidak */
        .piece-pool {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .chess-piece {
            width: 38px;
            height: 38px;
            background: #0f172a;
            border: 2px solid #38bdf8;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            cursor: grab;
            user-select: none;
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.3);
        }

        .chess-piece:active {
            cursor: grabbing;
        }

        /* Timeline Info Objektif */
        .objective-box {
            font-size: 11px;
            color: #cbd5e1;
            background: #030712;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #1e293b;
            line-height: 1.4;
        }

        .objective-box ul {
            padding-left: 15px;
            margin-top: 4px;
        }

        /* Area Peta / Map Strategy Board */
        .map-board-wrapper {
            flex: 1;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid #0284c7;
            border-radius: 12px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.8);
        }

        .map-canvas {
            width: 100%;
            height: 100%;
            position: relative;
            background-image: url('11312.jpg');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }

        /* Bidak di dalam map */
        .dropped-piece {
            position: absolute;
            width: 32px;
            height: 32px;
            background: #ef4444;
            border: 2px solid #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
            cursor: move;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        .btn-action-group {
            display: flex;
            gap: 8px;
            margin-top: auto;
        }

        .action-btn {
            flex: 1;
            background: #0284c7;
            border: none;
            color: white;
            padding: 8px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 11px;
            cursor: pointer;
        }

        .action-btn.danger {
            background: #ef4444;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <div style="display: flex; align-items: center; gap: 12px;">
            <button class="back-btn" onclick="window.location.href='index.html'">←</button>
            <div class="room-title">War Room - Snexty Mobile Legends Tactic</div>
        </div>
        <div style="font-size: 11px; color: #38bdf8;">Draft & Strategy Control</div>
    </div>

    <!-- Main Content -->
    <div class="strategy-container">
        
        <!-- Sidebar Kontrol -->
        <div class="sidebar">
            <div>
                <div class="section-title">Fase Permainan</div>
                <div class="phase-tabs">
                    <div class="phase-tab active" onclick="switchPhase('early', this)">Early</div>
                    <div class="phase-tab" onclick="switchPhase('mid', this)">Mid</div>
                    <div class="phase-tab" onclick="switchPhase('late', this)">Late</div>
                </div>
            </div>

            <div>
                <div class="section-title">Palet Bidak Hero/Role</div>
                <div class="piece-pool">
                    <div class="chess-piece" draggable="true" ondragstart="drag(event)" id="p1">🛡️</div>
                    <div class="chess-piece" draggable="true" ondragstart="drag(event)" id="p2">⚔️</div>
                    <div class="chess-piece" draggable="true" ondragstart="drag(event)" id="p3">🎯</div>
                    <div class="chess-piece" draggable="true" ondragstart="drag(event)" id="p4">🔮</div>
                    <div class="chess-piece" draggable="true" ondragstart="drag(event)" id="p5">⚡</div>
                </div>
            </div>

            <div>
                <div class="section-title">Spawn Objektif & Info</div>
                <div class="objective-box" id="objective-info">
                    <strong>⏱️ Early Game (0:00 - 5:00):</strong>
                    <ul>
                        <li>Minionwave pertama bertemu (10 detik)</li>
                        <li>Lithowanderer aktif (0:45)</li>
                        <li>Turtle pertama spawn di (2:00)</li>
                    </ul>
                </div>
            </div>

            <div class="btn-action-group">
                <button class="action-btn" onclick="toggleLineMode()">Mode Garis: OFF</button>
                <button class="action-btn danger" onclick="resetMap()">Reset</button>
            </div>
        </div>

        <!-- Papan Map -->
        <div class="map-board-wrapper">
            <div class="map-canvas" id="mapCanvas" ondragover="allowDrop(event)" ondrop="drop(event)" onclick="handleMapClick(event)">
                <!-- Tempat bidak & jalur rotasi -->
            </div>
        </div>

    </div>

    <script>
        let isDrawingLine = false;
        let lastX = null, lastY = null;

        function switchPhase(phase, el) {
            document.querySelectorAll('.phase-tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            
            const info = document.getElementById('objective-info');
            if(phase === 'early') {
                info.innerHTML = `<strong>⏱️ Early Game (0:00 - 5:00):</strong><ul><li>Minionwave pertama (0:10)</li><li>Lithowanderer aktif (0:45)</li><li>Turtle pertama spawn di (2:00)</li></ul>`;
            } else if(phase === 'mid') {
                info.innerHTML = `<strong>⏱️ Mid Game (5:00 - 12:00):</strong><ul><li>Turtle terakhir spawn (sebelum menit 5)</li><li>Lord level 1 muncul (8:00)</li><li>Turret luar hancur, buka akses jungle</li></ul>`;
            } else {
                info.innerHTML = `<strong>⏱️ Late Game (12:00+):</strong><ul><li>Lord Evolved / Lord Kuat (12:00+)</li><li>Base Turret aktif menyerang</li><li>Fokus Teamfight penentuan menang/kalah</li></ul>`;
            }
        }

        function allowDrop(ev) {
            ev.preventDefault();
        }

        function drag(ev) {
            ev.dataTransfer.setData("text", ev.target.id);
        }

        function drop(ev) {
            ev.preventDefault();
            var data = ev.dataTransfer.getData("text");
            var originalPiece = document.getElementById(data);
            
            var rect = document.getElementById('mapCanvas').getBoundingClientRect();
            var x = ev.clientX - rect.left;
            var y = ev.clientY - rect.top;

            var clone = document.createElement('div');
            clone.className = 'dropped-piece';
            clone.innerHTML = originalPiece.innerHTML;
            clone.style.left = x + 'px';
            clone.style.top = y + 'px';
            
            document.getElementById('mapCanvas').appendChild(clone);
        }

        function toggleLineMode() {
            isDrawingLine = !isDrawingLine;
            const btn = event.target;
            btn.innerText = isDrawingLine ? "Mode Garis: ON" : "Mode Garis: OFF";
            btn.style.background = isDrawingLine ? "#16a34a" : "#0284c7";
            lastX = null;
            lastY = null;
        }

        function handleMapClick(ev) {
            if (!isDrawingLine) return;
            
            var rect = document.getElementById('mapCanvas').getBoundingClientRect();
            var x = ev.clientX - rect.left;
            var y = ev.clientY - rect.top;

            if (lastX !== null && lastY !== null) {
                // Buat garis rotasi sederhana pakai elemen div tipis
                var line = document.createElement('div');
                var length = Math.hypot(x - lastX, y - lastY);
                var angle = Math.atan2(y - lastY, x - lastX) * 180 / Math.PI;

                line.style.position = 'absolute';
                line.style.left = lastX + 'px';
                line.style.top = lastY + 'px';
                line.style.width = length + 'px';
                line.style.height = '3px';
                line.style.background = '#38bdf8';
                line.style.transformOrigin = '0 0';
                line.style.transform = 'rotate(' + angle + 'deg)';
                line.style.pointerEvents = 'none';
                line.className = 'dropped-piece-line';

                document.getElementById('mapCanvas').appendChild(line);
            }
            lastX = x;
            lastY = y;
        }

        function resetMap() {
            document.querySelectorAll('.dropped-piece, .dropped-piece-line').forEach(p => p.remove());
            lastX = null;
            lastY = null;
        }
    </script>
</body>
</html>
