<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050914">
<title>TEAM SNEXTY | ACCESS</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    color:white;
    background:
        radial-gradient(circle at 50% 35%,#102d55 0%,#07101f 28%,#03050a 70%);
}

/* GRID RINGAN */

.grid{
    position:fixed;
    inset:0;
    opacity:.16;
    background-image:
        linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
    background-size:50px 50px;
    transform:perspective(500px) rotateX(58deg) scale(1.5);
    transform-origin:center bottom;
}

/* GLOW */

.glow{
    position:fixed;
    width:300px;
    height:300px;
    left:50%;
    top:40%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:rgba(20,110,255,.16);
    filter:blur(45px);
    animation:pulse 4s ease-in-out infinite;
}

@keyframes pulse{
    0%,100%{opacity:.55;transform:translate(-50%,-50%) scale(.9)}
    50%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}
}

/* LIGHT LINE */

.light{
    position:fixed;
    width:1px;
    height:120%;
    left:50%;
    top:-10%;
    background:linear-gradient(
        transparent,
        rgba(255,255,255,.45),
        transparent
    );
    transform:rotate(28deg);
    opacity:.35;
    animation:lightMove 6s ease-in-out infinite;
}

@keyframes lightMove{
    0%,100%{margin-left:-250px;opacity:0}
    50%{margin-left:250px;opacity:.5}
}

/* HEADER */

.header{
    position:absolute;
    top:28px;
    left:35px;
    right:35px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    z-index:5;
}

.brand{
    font-size:17px;
    font-weight:bold;
    letter-spacing:4px;
    background:linear-gradient(90deg,#fff,#9daabd,#fff);
    -webkit-background-clip:text;
    color:transparent;
}

.est{
    font-size:9px;
    letter-spacing:3px;
    color:#68758b;
}

/* MAIN */

.main{
    position:relative;
    z-index:3;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

/* CONTENT */

.content{
    width:100%;
    max-width:450px;
    text-align:center;
}

.tag{
    display:inline-block;
    padding:7px 13px;
    border:1px solid rgba(80,160,255,.35);
    border-radius:30px;
    color:#78bfff;
    font-size:9px;
    letter-spacing:2px;
    background:rgba(30,100,200,.07);
    margin-bottom:22px;
}

.title{
    font-size:clamp(38px,11vw,64px);
    line-height:.9;
    font-weight:900;
    letter-spacing:-3px;
}

.title .white{
    background:linear-gradient(180deg,#fff,#9ba8b9);
    -webkit-background-clip:text;
    color:transparent;
}

.title .blue{
    color:#3293ff;
    text-shadow:0 0 25px rgba(40,140,255,.35);
}

.subtitle{
    margin-top:18px;
    color:#8c99ab;
    font-size:11px;
    letter-spacing:2px;
}

/* LOGIN */

.login{
    margin:30px auto 0;
    width:100%;
    padding:20px;
    border:1px solid rgba(100,160,255,.16);
    border-radius:20px;
    background:rgba(5,10,20,.78);
    box-shadow:
        0 20px 60px rgba(0,0,0,.4),
        inset 0 1px rgba(255,255,255,.05);
    backdrop-filter:blur(10px);
}

.label{
    text-align:left;
    color:#69778c;
    font-size:9px;
    letter-spacing:2px;
    margin-bottom:9px;
}

.input-wrap{
    position:relative;
}

input{
    width:100%;
    height:52px;
    padding:0 48px 0 15px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.09);
    outline:none;
    background:#080e19;
    color:white;
    font-size:14px;
    transition:.2s;
}

input:focus{
    border-color:#287fff;
    box-shadow:0 0 0 3px rgba(40,127,255,.08);
}

.eye{
    position:absolute;
    right:15px;
    top:50%;
    transform:translateY(-50%);
    color:#718097;
    cursor:pointer;
    user-select:none;
}

/* BUTTON */

button{
    width:100%;
    height:52px;
    margin-top:12px;
    border:0;
    border-radius:12px;
    cursor:pointer;
    color:white;
    font-weight:bold;
    letter-spacing:2px;
    background:linear-gradient(
        100deg,
        #0d55c9,
        #1689ff,
        #0d55c9
    );
    background-size:200% 100%;
    animation:buttonMove 3s linear infinite;
    box-shadow:0 10px 30px rgba(10,100,255,.2);
}

@keyframes buttonMove{
    0%{background-position:0%}
    100%{background-position:200%}
}

button:active{
    transform:scale(.98);
}

/* STATUS */

.status{
    min-height:18px;
    margin-top:12px;
    font-size:10px;
    color:#68768b;
}

.success{
    color:#62ffad;
}

.error{
    color:#ff6675;
}

.footer{
    margin-top:18px;
    color:#465266;
    font-size:8px;
    letter-spacing:2px;
}

/* MOBILE */

@media(max-width:500px){

    .header{
        top:20px;
        left:20px;
        right:20px;
    }

    .brand{
        font-size:13px;
        letter-spacing:3px;
    }

    .est{
        font-size:7px;
    }

    .login{
        margin-top:25px;
        padding:16px;
    }

    .title{
        font-size:48px;
    }

    .subtitle{
        font-size:9px;
    }
}

/* REDUCE MOTION */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{
        animation:none !important;
        transition:none !important;
    }
}
</style>
</head>

<body>

<div class="grid"></div>
<div class="glow"></div>
<div class="light"></div>

<header class="header">
    <div class="brand">TEAM SNEXTY</div>
    <div class="est">SECURE SYSTEM</div>
</header>

<main class="main">

    <div class="content">

        <div class="tag">
            SECURE ACCESS • ONLINE
        </div>

        <h1 class="title">
            <span class="white">TEAM</span><br>
            <span class="blue">SNEXTY</span>
        </h1>

        <p class="subtitle">
            MORE THAN A TEAM — ONE GOAL
        </p>

        <div class="login">

            <div class="label">
                ENTER ACCESS PASSWORD
            </div>

            <div class="input-wrap">

                <input
                    id="password"
                    type="password"
                    placeholder="Masukkan kata sandi"
                    autocomplete="off"
                >

                <span
                    class="eye"
                    onclick="togglePassword()"
                    id="eye">
                    ◉
                </span>

            </div>

            <button onclick="login()">
                UNLOCK →
            </button>

            <div
                class="status"
                id="status">
            </div>

            <div class="footer">
                AUTHORIZED TEAM MEMBERS ONLY
            </div>

        </div>

    </div>

</main>

<script>

const correctPassword = "united we rise";

const passwordInput =
    document.getElementById("password");

const statusText =
    document.getElementById("status");

function togglePassword(){

    if(passwordInput.type === "password"){
        passwordInput.type = "text";
    }else{
        passwordInput.type = "password";
    }

}

function login(){

    const password =
        passwordInput.value.trim();

    if(password === correctPassword){

        statusText.textContent =
            "✓ ACCESS GRANTED";

        statusText.className =
            "status success";

        setTimeout(function(){

            window.location.href =
                "home.html";

        },600);

    }else{

        statusText.textContent =
            "✕ ACCESS DENIED — WRONG PASSWORD";

        statusText.className =
            "status error";

        passwordInput.value = "";

        passwordInput.focus();

    }

}

passwordInput.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){
            login();
        }

    }
);

</script>

</body>
</html>
