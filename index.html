<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

:root{
  --blue:#087cff;
  --cyan:#00d9ff;
  --white:#eef7ff;
  --dark:#02050b;
}

body{
  min-height:100vh;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  color:white;
  background:
    radial-gradient(circle at 50% 50%,#06234b 0%,#030914 35%,#010207 75%);
}

/* =========================
   BACKGROUND GRID
========================= */

.grid{
  position:fixed;
  inset:-100%;
  background-image:
    linear-gradient(#087cff18 1px,transparent 1px),
    linear-gradient(90deg,#087cff18 1px,transparent 1px);
  background-size:55px 55px;
  transform:perspective(500px) rotateX(65deg);
  animation:gridMove 5s linear infinite;
}

@keyframes gridMove{
  from{
    transform:perspective(500px) rotateX(65deg)
              translateY(0);
  }
  to{
    transform:perspective(500px) rotateX(65deg)
              translateY(55px);
  }
}

/* =========================
   LIGHT ORBS
========================= */

.orb{
  position:fixed;
  border-radius:50%;
  filter:blur(80px);
  pointer-events:none;
}

.orb1{
  width:300px;
  height:300px;
  background:#006eff;
  opacity:.22;
  top:-120px;
  left:-100px;
  animation:orb1 8s infinite alternate ease-in-out;
}

.orb2{
  width:350px;
  height:350px;
  background:#00c8ff;
  opacity:.13;
  right:-150px;
  bottom:-150px;
  animation:orb2 10s infinite alternate ease-in-out;
}

@keyframes orb1{
  to{
    transform:translate(220px,160px);
  }
}

@keyframes orb2{
  to{
    transform:translate(-180px,-140px);
  }
}

/* =========================
   PARTICLES
========================= */

  position:fixed;
  inset:0;
  pointer-events:none;
}

.particle{
  position:absolute;
  width:3px;
  height:3px;
  background:#49b8ff;
  border-radius:50%;
  box-shadow:0 0 10px #009dff;

}
